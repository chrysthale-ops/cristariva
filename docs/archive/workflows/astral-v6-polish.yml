name: Concise final synthesis v10

on:
  push:
    paths:
      - '.github/workflows/astral-v6-polish.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply concise synthesis v10
        run: python tools/literary_final_v7.py
      - name: Validate
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'synthèse concise et fluide v10' in s
          block=re.search(r'function renderSynthesis\(\)\{.*?\n\}',s,re.S).group(0)
          assert 'literaryFinalSynthesis()' in block
          assert 'storyInterpretation(state.draw)' not in block
          assert 'function finalContext()' in s
          assert 'function finalSemanticKey(c)' in s
          assert 'function finalRoleSentence(c,role,en)' in s
          assert 'cristariva-modele-a-v20-20260913-synthese-concise' in Path('service-worker.js').read_text(encoding='utf-8')
          assert 'Dans votre couple' in s
          assert 'Un élément extérieur encore mal identifié peut intervenir, sans devenir le centre de votre relation.' in s
          scripts='\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S|re.I))
          Path('/tmp/check.js').write_text(scripts,encoding='utf-8')
          PY
          node --check /tmp/check.js
      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Make final synthesis shorter clearer and question-led"
          git push
