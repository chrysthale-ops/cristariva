name: Precise Relation and Dating cards v4b

on:
  push:
    paths:
      - '.github/workflows/precision-relation-dating-v4b.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the validated rewrite script
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/precision-relation-dating-v4.yml').read_text(encoding='utf-8').splitlines()
          start = None
          out = []
          for i, line in enumerate(src):
              if "python - <<'PY'" in line:
                  start = i + 1
                  break
          if start is None:
              raise SystemExit('Rewrite script not found')
          for line in src[start:]:
              if line.strip() == 'PY':
                  break
              out.append(line[10:] if line.startswith('          ') else line)
          code = '\n'.join(out)
          compile(code, '<relation-dating-rewrite>', 'exec')
          exec(code, {'__name__': '__main__'})
          PY

      - name: Verify data can be parsed and supplemental cards exist
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          text = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'const DATA\s*=\s*(\{.*?\});', text, re.S)
          assert m, 'DATA missing'
          data = json.loads(m.group(1))
          ids = set()
          def walk(obj):
              if isinstance(obj, dict):
                  if isinstance(obj.get('id'), int): ids.add(obj['id'])
                  for value in obj.values(): walk(value)
              elif isinstance(obj, list):
                  for value in obj: walk(value)
          walk(data)
          missing = set(range(96,131)) - ids
          assert not missing, f'Missing supplemental cards: {sorted(missing)}'
          assert "cristariva-modele-a-v13-20260913-precis-relations-datation" in Path('service-worker.js').read_text(encoding='utf-8')
          print('Parse OK. 35 supplemental cards present. Cache v13 present.')
          PY

      - name: Commit and publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Make Relation and Dating card interpretations precise'
            git push
          fi
