name: Install Oracle Amour CRISTARIVA
on:
  push:
    branches: [main]
    paths: ['.cristariva-assets/oracle-amour-ready.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Rebuild embedded Oracle Amour data
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, re
          files=sorted(Path('.cristariva-assets').glob('oracle-amour-part*.b64'))
          parts=[]
          for p in files:
              s=p.read_text(encoding='utf-8-sig')
              s=''.join(re.findall(r'[A-Za-z0-9+/=]',s))
              parts.append(s)
              print(p.name,'clean=',len(s),'start=',s[:12],'end=',s[-12:])
          if len(parts)!=3:
              raise SystemExit(f'3 fragments attendus, {len(parts)} trouvés')
          def b64(txt):
              txt=txt.rstrip('=')
              txt += '='*((4-len(txt)%4)%4)
              return base64.b64decode(txt,validate=False)
          def try_gzip(txt):
              try: return gzip.decompress(b64(txt))
              except Exception: return None
          # First try the unmodified stream.
          data=try_gzip(''.join(parts)); label='natural'
          # The first uploaded fragment is 2 chars longer than the intended 20k blocks.
          # Search small overlaps/surpluses at both fragment boundaries and accept only
          # a stream with a valid GZIP trailer (gzip.decompress checks CRC/size).
          if data is None:
              found=None
              for end0 in range(0,9):
                p0=parts[0][:-end0] if end0 else parts[0]
                for start1 in range(0,9):
                  p1a=parts[1][start1:]
                  for end1 in range(0,9):
                    p1=p1a[:-end1] if end1 else p1a
                    for start2 in range(0,9):
                      txt=p0+p1+parts[2][start2:]
                      out=try_gzip(txt)
                      if out is not None:
                        found=(end0,start1,end1,start2,out)
                        break
                    if found: break
                  if found: break
                if found: break
              if found:
                  end0,start1,end1,start2,data=found
                  label=f'boundary repair end0={end0} start1={start1} end1={end1} start2={start2}'
          if data is None:
              raise SystemExit('Impossible de reconstruire le paquet Oracle Amour par réparation de jonctions')
          Path('oracle-amour-data.js').write_bytes(data)
          print('Oracle Amour reconstruit via',label,'=>',len(data),'octets JS')
          PY
      - name: Patch website and Android PWA
        run: python scripts/install_oracle_amour.py
      - name: Validate
        run: |
          node --check oracle-amour-data.js
          node --check oracle-amour-integration.js
          node - <<'NODE'
          global.window=global;
          require('./oracle-amour-data.js');
          if(!global.AMOUR_DATA) throw new Error('AMOUR_DATA absent');
          const d=global.AMOUR_DATA;
          if(d.main.length!==60 || d.relation.length!==10 || d.dating.length!==10) throw new Error(`Comptage Oracle Amour invalide: ${d.main.length}/${d.relation.length}/${d.dating.length}`);
          const all=[...d.main,...d.relation,...d.dating];
          if(all.some(c=>!c.id||!c.name||!c.definition||!c.image)) throw new Error('Une carte Oracle Amour est incomplète');
          console.log('Oracle Amour validé:',d.main.length,d.relation.length,d.dating.length,'= 80 cartes');
          NODE
          grep -q "Sentimental" oracle-amour-integration.js
          grep -q "RELATION NON DÉFINIE" oracle-amour-data.js
          grep -q "oracle-amour-integration.js" index.html
          grep -q "cristariva-v56-20260917-oracle-amour" service-worker.js
      - name: Clean temporary payload
        run: |
          rm -rf .cristariva-assets
          rm -f scripts/install_oracle_amour.py
          rm -f .github/workflows/install-oracle-amour.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Oracle Amour and Sentimental domain"
          git push origin HEAD:main
