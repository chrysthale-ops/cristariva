name: Precise Relation and Dating cards v4

on:
  push:
    paths:
      - '.github/workflows/precision-relation-dating-v4.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite Relation and Dating card meanings precisely
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          match = re.search(r'const DATA\s*=\s*(\{.*?\});', text, re.S)
          if not match:
              raise SystemExit('const DATA not found')
          data = json.loads(match.group(1))

          cards = {}
          def walk(obj):
              if isinstance(obj, dict):
                  cid = obj.get('id')
                  if isinstance(cid, int):
                      cards[cid] = obj
                  for value in obj.values():
                      walk(value)
              elif isinstance(obj, list):
                  for value in obj:
                      walk(value)
          walk(data)

