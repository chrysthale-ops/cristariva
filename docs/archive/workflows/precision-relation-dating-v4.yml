          assert m, 'DATA missing after update'
          data = json.loads(m.group(1))
          cards = {}
          def walk(obj):
              if isinstance(obj, dict):
                  if isinstance(obj.get('id'), int): cards[obj['id']] = obj
                  for value in obj.values(): walk(value)
              elif isinstance(obj, list):
                  for value in obj: walk(value)
          walk(data)
          for cid in range(96, 131):
              assert cid in cards, f'card {cid} missing'
              for key in ('definition','meaning','message'):
