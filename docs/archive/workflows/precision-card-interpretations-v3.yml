n refus, une divergence d’envies ou un obstacle extérieur s’oppose clairement au rapprochement physique.","63":"le désir a besoin de revenir au corps et au réel : présence, toucher, disponibilité concrète et sécurité comptent plus que les scénarios mentaux.","64":"une coupure a interrompu ou transforme profondément la vie sexuelle ; toute reprise supposerait un nouveau cadre.","65":"la sexualité est fragilisée par un mensonge, une omission ou un manque de transparence qui empêche le lâcher-prise.","66":"un signe concret et régulier permet d’évaluer la réalité du désir : initiative, présence, toucher, proposition ou disponibilité.","67":"la jalousie ou la peur d’un tiers trouble la sexualité et peut transformer le désir en contrôle ou en comparaison.","68":"la sexualité a besoin d’un cadre sécurisant, de limites respectées et d’une confiance suffisante pour s’ouvrir.","69":"une personne réfléchit à ses désirs, ses limites ou son orientation intime ; ce retrait peut précéder une décision plus claire.","70":"une proposition ou un rapprochement sexuel n’est pas accueilli ; le non ou la distance exprimée doit être respecté.","71":"un fantasme ou une attente sexuelle idéalisée se heurte à une réalité moins intense ou différente.","72":"plusieurs facteurs compliquent l’intimité en même temps : émotions, distance, disponibilité, passé, peur ou statut du lien.","73":"une connexion physique et émotionnelle est possible : attirance, complicité et envie de proximité peuvent se renforcer mutuellement.","74":"la fatigue réduit directement la libido, la disponibilité et la capacité à investir l’intimité.","75":"dans le cadre actuel, la sexualité ne trouve pas d’issue ; il faut changer la manière d’aborder le lien plutôt que forcer le même scénario.","76":"un nouveau départ intime est possible : découverte, première fois dans un nouveau cadre ou reprise sexuelle sur des bases différentes.","77":"la sexualité gagne à rester cohérente avec les valeurs, les limites et les engagements annoncés par chacun.","78":"la sexualité s’inscrit dans une question plus large de parcours de vie : ce que l’on veut vraiment vivre, assumer et construire dans l’intimité.","79":"une promesse de rapprochement ou de sexualité risque de rester au niveau des mots ; il faut attendre les actes.","80":"une ancienne expérience sexuelle a laissé une empreinte forte qui influence encore le désir, la confiance ou les réactions du corps.","81":"le désir est partagé et les initiatives se répondent ; la réciprocité sexuelle est l’un des meilleurs indicateurs d’une intimité réellement possible.","82":"un signe concret peut révéler un désir ou une ouverture sexuelle, mais il doit rester interprété avec les autres comportements.","83":"le désir ou la disponibilité varie fortement ; l’intimité risque d’être irrégulière tant qu’un rythme plus stable n’apparaît pas.","84":"la sexualité risque d’être utilisée pour influencer, culpabiliser ou obtenir quelque chose ; la liberté de consentement doit être protégée.","85":"le rapprochement physique avance réellement, même s’il se fait par étapes ; des signes concrets de progression apparaissent.","86":"la sexualité fonctionne mieux avec assez de proximité pour nourrir le désir et assez d’espace pour préserver l’autonomie.","87":"l’intimité est différée ; le désir peut exister, mais le passage à l’acte ou la rencontre prend plus de temps.","88":"la question sexuelle doit être replacée dans ce que l’on veut vivre à moyen ou long terme, pas seulement dans l’envie immédiate.","89":"une nouvelle compréhension de ses désirs, de son corps ou de sa manière de vivre l’intimité apparaît.","90":"une intimité passée, un ancien partenaire ou un désir déjà connu peut revenir dans le champ de la relation.","91":"la sexualité gagne à être abordée avec maturité : désir oui, mais aussi compatibilité, consentement, conséquences et respect du rythme.","92":"la vie sexuelle change profondément de forme, de rythme ou de priorités ; l’ancien modèle ne suffit plus.","93":"il existe une possibilité de rapprochement sexuel, mais elle n’est pas encore réalisée et dépend des actes, de la réciprocité et du contexte.","94":"la situation invite à se sentir protégé et guidé vers une intimité qui respecte le corps, les limites et le bien-être plutôt qu’une intensité à tout prix.","95":"une occasion concrète de rapprochement ou d’intimité peut se présenter ; elle doit être reconnue puis consentie et saisie par les deux personnes."};\n\nfunction preciseQuestionFocus(){\n const q=(state.question||"").toLowerCase(), d=(state.domain||"").toLowerCase(), t=q+" "+d;\n if(/sexe|sexuel|sexuelle|sexualit|coucher|désir|desir|intimit|libido|charnel|sensuel|sensuelle|physique/.test(t))return "sex";\n if(/message|contact|écrire|ecrire|recontact|appel|réponse|reponse|whatsapp/.test(t))return "contact";\n if(/retour|revenir|revient|réconcili|reconcili|retrouvaille/.test(t))return "return";\n if(/sentiment|ressent|amour|amoureux|aime|attirance|couple|relation/.test(t))return "love";\n if(/travail|profession|emploi|carrière|carriere|projet|work|career/.test(t))return "work";\n if(/argent|finance|matériel|materiel|revenu|money/.test(t))return "money";\n if(/spirit|éveil|eveil|intuition|médiumn|medium|guidance|âme|ame/.test(t))return "spirit";\n return readingContext();\n}\nfunction preciseSubject(focus,en){\n if(en){\n  return ({sex:"your sex life and intimacy",contact:"communication and contact",return:"a possible return",love:"your emotional life",work:"your professional situation",money:"your material situation",spirit:"your inner or spiritual path",life:"your personal journey"})[focus]||"your situation";\n }\n return ({sex:"votre vie sexuelle et votre intimité",contact:"la communication et la reprise de contact",return:"un éventuel retour",love:"votre vie affective",work:"votre situation professionnelle",money:"votre situation matérielle",spirit:"votre cheminement intérieur ou spirituel",life:"votre situation"})[focus]||"votre situation";\n}\nfunction preciseReading(c,focus,en){\n if(!c)return "";\n if(!en && focus==="sex" && PRECISE_SEX[c.id])return PRECISE_SEX[c.id];\n if(!en && c.group==="main"){\n  if(focus==="work")return c.reading_professionnel||c.definition||"";\n  if(focus==="spirit"||focus==="life")return c.reading_spirituel||c.meaning||c.definition||"";\n  return c.reading_relationnel||c.definition||"";\n }\n return readingClause(c,en);\n}\nfunction preciseSexResourceNote(c){\n const n=(c?.name||"").toLowerCase();\n if(n==="éloignement")return "Placée en force, cette distance peut paradoxalement être utile : elle fait retomber la pression, redonne de l’espace au désir et évite de forcer une intimité qui n’est pas prête.";\n if(n==="maîtrise")return "Placée en force, cette maîtrise aide à respecter le rythme, les limites et le consentement sans laisser l’impulsion décider seule.";\n if(n==="patience")return "Placée en force, la patience permet au désir de se reconstruire sans pression ni précipitation.";\n if(n==="communication")return "Placée en force, la parole devient le moyen le plus direct de clarifier envies, limites et disponibilité.";\n if(n==="connexion")return "Placée en force, la connexion nourrit une proximité qui peut ensuite devenir physique si elle est réciproque.";\n if(n==="passion")return "Placée en force, l’attirance est un moteur puissant ; elle doit toutefois rester compatible avec les limites et les intentions de chacun.";\n return "Dans la position de force, cette carte montre ce qui peut être utilisé concrètement pour faire évoluer la situation plutôt que ce qui doit seulement être subi.";\n}\nfunction preciseSexConclusion(cards){\n const names=cards.map(c=>(c?.name||"").toLowerCase());\n const final=names[names.length-1]||"";\n const negatives=new Set(["refus","rejet","éloignement","blocage","rupture","fin","indifférence","incompatibilité","impasse","retard","peur","épuisement","opposition","conflit","emprise","manipulation","échec","abandon","perte"]);\n const positives=new Set(["connexion","passion","union","réciprocité","amour","joie","bonheur","réconciliation","libération","naissance","éclosion","renouveau","succès","opportunité","potentiel","percée"]);\n let neg=names.filter(n=>negatives.has(n)).length, pos=names.filter(n=>positives.has(n)).length;\n const slow=names.some(n=>["patience","retard","éloignement","juste distance","rythme","maîtrise"].includes(n));\n if(["connexion","passion","union","réciprocité","amour","réconciliation","succès"].includes(final)){\n  if(neg>=2||slow)return "En clair : la perspective sexuelle reste ouverte, mais elle n’est pas immédiate ni automatique. Le tirage montre d’abord des freins à respecter et à résoudre ; le rapprochement physique devient surtout possible lorsque la confiance, la disponibilité et la réciprocité sont réellement revenues.";\n  return "En clair : la tendance est favorable à un rapprochement physique et à une sexualité partagée, à condition que l’envie soit confirmée dans les deux sens et qu’elle se traduise par des actes.";\n }\n if(neg>=3)return "En clair : la sexualité apparaît actuellement très freinée. Le tirage ne décrit pas un passage à l’acte fluide à court terme ; il montre d’abord des limites, une distance ou un désaccord à traiter.";\n if(pos>neg)return slow?"En clair : une ouverture sexuelle existe, mais elle se construit lentement. Le désir a besoin de temps et de signes réciproques avant de devenir concret.":"En clair : le tirage contient davantage d’ouverture que de fermeture sur le plan sexuel, mais la concrétisation dépend toujours d’un désir et d’un consentement réciproques.";\n if(slow)return "En clair : la question sexuelle n’est pas fermée, mais le rythme est lent. Le tirage conseille de regarder la progression réelle plutôt que d’attendre une concrétisation immédiate.";\n return "En clair : le tirage est partagé sur le plan sexuel. Il faut surtout observer les actes, la disponibilité réelle et la réciprocité avant de conclure à un rapprochement.";\n}\nfunction preciseGeneralConclusion(cards,focus,en){\n const last=cards[cards.length-1];\n if(en)return readingOutcome(last,true);\n if(focus==="sex")return preciseSexConclusion(cards);\n const n=(last?.name||"").toLowerCase();\n if(["connexion","union","réciprocité","réconciliation","retour","succès","bonheur"].includes(n))return "La synthèse ouvre donc une possibilité constructive, mais elle doit être confirmée par des actes cohérents avec les cartes précédentes.";\n if(["refus","rejet","rupture","fin","impasse","échec"].includes(n))return "La synthèse reste restrictive : le tirage demande de prendre au sérieux la limite ou la clôture indiquée plutôt que de la contourner par l’interprétation.";\n if(["patience","retard","rythme","transition"].includes(n))return "La synthèse ne ferme pas la situation, mais elle refuse l’idée d’un résultat immédiat : le temps et les étapes intermédiaires font partie de la réponse.";\n return readingOutcome(last,false);\n}\nfunction storyInterpretation(cards){\n if(!cards.length)return "";\n const en=state.lang==="en", n=cards.length, focus=preciseQuestionFocus();\n const subject=preciseSubject(focus,en), name=c=>readingEscape(cardName(c)), read=c=>preciseReading(c,focus,en);\n let paragraphs=[];\n if(n===1){\n  const a=cards[0];\n  paragraphs.push(en?`For ${subject}, <strong>${name(a)}</strong> is the central message: ${read(a)} ${preciseGeneralConclusion(cards,focus,true)}`:`Pour ${subject}, <strong>${name(a)}</strong> donne le message central : ${read(a)} ${preciseGeneralConclusion(cards,focus,false)}`);\n }else if(n===3){\n  const [a,b,c]=cards;\n  if(en){\n   paragraphs.push(`The starting point is <strong>${name(a)}</strong>: ${read(a)}`);\n   paragraphs.push(`The present is described by <strong>${name(b)}</strong>: ${read(b)}`);\n   paragraphs.push(`The direction is carried by <strong>${name(c)}</strong>: ${read(c)} ${preciseGeneralConclusion(cards,focus,true)}`);\n  }else{\n   paragraphs.push(`Le tirage part de <strong>${name(a)}</strong> : ${read(a)}`);\n   paragraphs.push(`La situation actuelle est précisée par <strong>${name(b)}</strong> : ${read(b)}`);\n   paragraphs.push(`La direction donnée par <strong>${name(c)}</strong> est la suivante : ${read(c)} ${preciseGeneralConclusion(cards,focus,false)}`);\n  }\n }else{\n  const [a,b,c,d,e]=cards;\n  if(en){\n   paragraphs.push(`At the origin of ${subject}, <strong>${name(a)}</strong> sets the starting point: ${read(a)}`);\n   paragraphs.push(`The main obstacle is <strong>${name(b)}</strong>: ${read(b)}`);\n   paragraphs.push(`The resource available is <strong>${name(c)}</strong>: ${read(c)}`);\n   paragraphs.push(`The evolution is shown by <strong>${name(d)}</strong>: ${read(d)}`);\n   paragraphs.push(`Finally, <strong>${name(e)}</strong> gives the synthesis: ${read(e)} ${preciseGeneralConclusion(cards,focus,true)}`);\n  }else{\n   paragraphs.push(`Au point de départ de ${subject}, <strong>${name(a)}</strong> pose le décor : ${read(a)}`);\n   paragraphs.push(`Le principal obstacle est <strong>${name(b)}</strong> : ${read(b)}${focus==="sex"&&((b.name||"").toLowerCase()==="maîtrise")?" Autrement dit, le frein peut venir moins d’une absence de désir que d’un désir très contenu, contrôlé ou difficile à laisser s’exprimer.":""}`);\n   paragraphs.push(`La ressource du tirage est <strong>${name(c)}</strong> : ${read(c)} ${focus==="sex"?preciseSexResourceNote(c):"Placée ici, cette carte montre ce qui peut être mobilisé pour modifier concrètement la situation."}`);\n   paragraphs.push(`L’évolution est portée par <strong>${name(d)}</strong> : ${read(d)}${focus==="sex"&&((d.name||"").toLowerCase()==="patience")?" Cela indique une progression possible, mais sans passage à l’acte rapide ni pression sur le calendrier.":""}`);\n   paragraphs.push(`Enfin, <strong>${name(e)}</strong> rassemble le tirage : ${read(e)} ${preciseGeneralConclusion(cards,focus,false)}`);\n  }\n }\n const question=state.question?`<p class="reading-question">${en?"Your question":"Votre question"} : « ${readingEscape(state.question)} »</p>`:"";\n return `<div class="story-reading"><h3>${en?"The story told by your cards":"L’histoire racontée par vos cartes"}</h3>${question}${paragraphs.map(p=>`<p>${p}</p>`).join("")}</div>`;\n}\nfunction interpretation(cards){return storyInterpretation(cards);}'
          pattern = r'function storyInterpretation\(cards\)\{.*?\n\}\nfunction interpretation\(cards\)\{return storyInterpretation\(cards\);\}'
