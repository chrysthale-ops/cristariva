name: Precise card definitions and readings v3

on:
  push:
    paths:
      - '.github/workflows/precision-card-interpretations-v3.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make card definitions and stories precise
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          
          m = re.search(r'const DATA =(\{.*?\});\nlet state=', s, re.S)
          if not m:
              raise SystemExit('DATA block not found')
          data = json.loads(m.group(1))
          
          OVERRIDES = {1: {'definition': 'Une direction se dessine : la carte indique vers quoi la situation cherche concrètement à aller, même si toutes les étapes ne sont pas encore visibles.', 'relation': 'Dans une relation, Direction montre qu’un cap se précise. Elle parle d’un lien qui doit choisir sa trajectoire : rapprochement, redéfinition ou prise de distance selon les cartes voisines.', 'work': 'Dans le travail, Direction indique qu’une orientation devient prioritaire. Il faut choisir le prochain objectif plutôt que disperser les efforts.', 'spirit': 'Sur le plan général ou spirituel, Direction invite à reconnaître le cap qui devient cohérent avec votre évolution actuelle.', 'message': 'Choisissez le cap avant d’accélérer : une direction claire vaut mieux qu’un mouvement dispersé.'}, 2: {'definition': 'La confiance a été atteinte par un acte, une omission ou une loyauté rompue. Cette carte oblige à distinguer ce qui a été réellement trahi de ce qui est seulement redouté.', 'relation': 'Dans une relation, Trahison signale une blessure de confiance : mensonge, double jeu, promesse rompue ou sentiment d’avoir été trompé. La suite dépend d’une clarification réelle, pas seulement d’excuses.', 'work': 'Dans le travail, Trahison peut désigner un engagement non tenu, une information retenue, une manœuvre déloyale ou un allié qui ne joue plus le rôle attendu.', 'spirit': 'Sur le plan intérieur, Trahison confronte à une rupture de confiance et demande de restaurer le discernement sans transformer toute prudence en soupçon.', 'message': 'Vérifiez les faits, nommez la rupture de confiance et observez si les actes permettent réellement de la réparer.'}, 4: {'definition': 'La distance augmente ou devient déterminante : elle peut être géographique, affective, mentale ou liée à une baisse de disponibilité.', 'relation': 'Dans une relation, Éloignement indique que les échanges, la présence ou l’intimité diminuent. Il peut s’agir d’une distance physique réelle ou d’un retrait affectif qui rend le rapprochement plus difficile.', 'work': 'Dans le travail, Éloignement parle d’un interlocuteur moins disponible, d’un projet qui s’éloigne de son objectif ou d’une collaboration qui perd en proximité.', 'spirit': 'Sur le plan général, Éloignement invite à voir ce dont vous vous détachez et si cette distance protège, libère ou fragilise la situation.', 'message': 'Identifiez la nature exacte de la distance : elle n’a pas le même sens si elle est choisie, subie ou temporaire.'}, 5: {'definition': 'Les émotions deviennent le principal moteur de la situation. Elles peuvent intensifier l’attachement, brouiller le jugement ou révéler un besoin jusque-là contenu.', 'relation': 'Dans une relation, Émotions indique que les réactions affectives sont fortes et influencent directement les échanges. Les cartes voisines montrent s’il s’agit d’attachement, de peur, de désir, de colère ou de nostalgie.', 'work': 'Dans le travail, Émotions montre que le vécu personnel pèse sur les décisions. Il faut distinguer ressenti utile, stress et réaction impulsive.', 'spirit': 'Sur le plan intérieur, Émotions demande d’identifier précisément ce qui est ressenti avant de lui donner une signification ou d’agir.', 'message': 'Nommez l’émotion dominante : elle éclaire la situation mieux qu’un ressenti laissé dans le flou.'}, 6: {'definition': 'Un détail concret contient une information utile : parole, comportement, répétition, absence, coïncidence ou élément matériel à ne pas négliger.', 'relation': 'Dans une relation, Indice attire l’attention sur un comportement ou une parole qui renseigne sur l’intention réelle de l’autre. Il faut l’examiner avec les autres cartes avant d’en tirer une conclusion.', 'work': 'Dans le travail, Indice signale une donnée discrète — retour, chiffre, délai, mail ou attitude — qui peut modifier l’analyse d’un projet.', 'spirit': 'Sur le plan général, Indice invite à regarder les petits faits qui donnent une direction à une intuition.', 'message': 'Ne cherchez pas un grand signe si un détail concret contient déjà l’information essentielle.'}, 7: {'definition': 'Une phase d’agitation forte bouleverse l’équilibre : conflit, débordement émotionnel, événement brusque ou accumulation qui finit par éclater.', 'relation': 'Dans une relation, Tempête décrit une période où les émotions et les tensions deviennent difficiles à contenir. Elle peut annoncer une dispute, un choc ou une remise à plat nécessaire.', 'work': 'Dans le travail, Tempête signale une crise, une surcharge, un conflit d’intérêts ou un imprévu qui oblige à réagir rapidement.', 'spirit': 'Sur le plan intérieur, Tempête parle d’un bouleversement qui fait remonter ce qui ne pouvait plus rester contenu.', 'message': 'Traversez d’abord la turbulence avant de prendre une décision irréversible.'}, 8: {'definition': 'Quelque chose revient sous forme de répétition : même parole, même sensation, même comportement ou même scénario. L’écho montre ce qui insiste.', 'relation': 'Dans une relation, Échos indique qu’un ancien thème se répète dans les échanges. Il peut s’agir d’un souvenir, d’un comportement récurrent ou d’une parole qui continue de produire un effet.', 'work': 'Dans le travail, Échos met en évidence un retour d’expérience, une répétition de problème ou un signal déjà observé qui mérite enfin d’être traité.', 'spirit': 'Sur le plan général, Échos montre qu’un motif répétitif cherche à être compris plutôt qu’ignoré.', 'message': 'Repérez ce qui se répète : l’écho devient utile lorsqu’on identifie sa source.'}, 9: {'definition': 'Une situation demande un rééquilibrage juste entre les besoins, les responsabilités et ce qui est donné ou reçu.', 'relation': 'Dans une relation, Équité interroge la répartition de l’attention, des efforts et des compromis. Le lien devient plus sain lorsque chacun assume une part comparable de responsabilité.', 'work': 'Dans le travail, Équité concerne la juste répartition des tâches, de la reconnaissance, des ressources ou des bénéfices.', 'spirit': 'Sur le plan général, Équité demande d’éviter aussi bien le sacrifice excessif que l’exigence unilatérale.', 'message': 'Recherchez un équilibre mesurable entre ce que chacun apporte, reçoit et assume.'}, 10: {'definition': 'Une information, une expérience, une valeur ou un savoir passe d’une personne à une autre et modifie la suite.', 'relation': 'Dans une relation, Transmission montre qu’une parole importante, une confidence, un héritage affectif ou un modèle familial influence le lien actuel.', 'work': 'Dans le travail, Transmission favorise apprentissage, passation, formation, documentation et partage d’expertise.', 'spirit': 'Sur le plan général, Transmission interroge ce que vous recevez d’une histoire passée et ce que vous choisissez d’en faire.', 'message': 'Identifiez ce qui vous est transmis et décidez consciemment de ce que vous souhaitez conserver.'}, 11: {'definition': 'Deux besoins, rythmes, valeurs ou projets de vie s’accordent difficilement. La difficulté est structurelle plutôt qu’un simple malentendu.', 'relation': 'Dans une relation, Incompatibilité indique que l’attirance ou l’attachement ne suffisent pas à effacer une différence importante de besoins, de disponibilité, de rythme ou de projet.', 'work': 'Dans le travail, Incompatibilité montre que deux méthodes, objectifs ou modes de fonctionnement se heurtent durablement.', 'spirit': 'Sur le plan général, Incompatibilité invite à cesser de forcer une association qui demande trop de renoncements essentiels.', 'message': 'Distinguez ce qui peut être négocié de ce qui est réellement incompatible.'}, 13: {'definition': 'Le résultat espéré n’est pas obtenu dans la forme ou le calendrier prévu. Cette carte parle d’un aboutissement manqué, pas d’une condamnation générale.', 'relation': 'Dans une relation, Échec indique qu’une tentative de rapprochement, de réparation ou de construction n’aboutit pas telle qu’elle était envisagée. Il faut comprendre pourquoi avant de recommencer.', 'work': 'Dans le travail, Échec signale un objectif non atteint, une validation refusée ou une stratégie qui ne produit pas le résultat attendu.', 'spirit': 'Sur le plan général, Échec demande de transformer un résultat décevant en information utile plutôt qu’en jugement sur soi.', 'message': 'Analysez ce qui n’a pas fonctionné avant de décider s’il faut recommencer, corriger ou changer de voie.'}, 16: {'definition': 'La situation repose sur des bases suffisamment solides pour résister aux variations immédiates. Stabilité parle de continuité, de fiabilité et de constance.', 'relation': 'Dans une relation, Stabilité indique une présence régulière, des repères fiables et une capacité à maintenir le lien dans le temps. Elle favorise ce qui se construit par des actes constants.', 'work': 'Dans le travail, Stabilité décrit une base solide : organisation fiable, revenus réguliers, équipe durable ou projet suffisamment sécurisé.', 'spirit': 'Sur le plan général, Stabilité invite à consolider ce qui fonctionne avant de chercher davantage d’intensité ou de nouveauté.', 'message': 'Mesurez la solidité par la continuité des actes, pas seulement par les intentions.'}, 17: {'definition': 'Un besoin, une habitude ou un attachement prend trop de place et réduit la liberté de choix.', 'relation': 'Dans une relation, Dépendance montre qu’un besoin de contact, de validation, de présence ou de sécurité devient disproportionné et peut déséquilibrer le lien.', 'work': 'Dans le travail, Dépendance signale une autonomie insuffisante : dépendance à une personne, un client, une ressource ou une organisation.', 'spirit': 'Sur le plan intérieur, Dépendance invite à retrouver une marge de choix là où une habitude ou un attachement semble indispensable.', 'message': 'Retrouvez une part d’autonomie avant de décider ce que vous voulez réellement conserver.'}, 20: {'definition': 'Un moment de décision ou d’aboutissement approche. Échéance rappelle qu’une situation ne peut pas rester indéfiniment en suspens.', 'relation': 'Dans une relation, Échéance indique qu’un échange, une décision ou une clarification devient nécessaire à court ou moyen terme. Le lien arrive à un point où l’indéfini pèse davantage.', 'work': 'Dans le travail, Échéance renvoie à une date butoir, une livraison, une décision attendue ou un engagement à respecter.', 'spirit': 'Sur le plan général, Échéance rappelle que certaines étapes doivent être clôturées ou décidées pour permettre la suivante.', 'message': 'Préparez la décision avant que le calendrier ne la prenne à votre place.'}, 22: {'definition': 'Ce qui était confus devient plus lisible. Clarté permet de distinguer les faits, les intentions et les priorités sans entretenir l’ambiguïté.', 'relation': 'Dans une relation, Clarté favorise une conversation nette, la compréhension des intentions et la fin d’un malentendu. Elle demande des paroles et des actes cohérents.', 'work': 'Dans le travail, Clarté aide à définir objectifs, responsabilités, priorités ou conditions d’un accord.', 'spirit': 'Sur le plan général, Clarté marque une compréhension plus simple et plus juste d’une situation auparavant brouillée.', 'message': 'Formulez la situation en termes simples : ce qui est clair devient plus facile à décider.'}, 23: {'definition': 'Une information doit circuler : parole, message, réponse, échange ou clarification. Le contenu et la qualité de l’échange deviennent déterminants.', 'relation': 'Dans une relation, Communication annonce ou demande un échange explicite. Elle peut parler d’un message, d’une conversation, d’une mise au point ou d’un besoin de dire ce qui était retenu.', 'work': 'Dans le travail, Communication concerne mails, réunions, négociations, présentation d’informations et coordination entre personnes.', 'spirit': 'Sur le plan général, Communication invite à mettre des mots précis sur ce qui ne peut plus être laissé aux suppositions.', 'message': 'Dites ce qui doit être compris et vérifiez que le message a réellement été reçu.'}, 24: {'definition': 'Le passé revient sous forme de remords, de nostalgie ou de désir de réparer ce qui aurait pu être fait autrement.', 'relation': 'Dans une relation, Regrets montre qu’une personne reste affectée par une décision, une absence, une parole ou une occasion manquée. Le regret peut favoriser une reprise de contact mais ne garantit pas une réparation.', 'work': 'Dans le travail, Regrets indique une décision passée que l’on réévalue, une opportunité manquée ou le souhait de corriger une erreur.', 'spirit': 'Sur le plan général, Regrets demande de transformer le passé en décision présente plutôt que de rester dans le scénario de ce qui aurait pu être.', 'message': 'Un regret devient utile lorsqu’il conduit à une réparation, un choix ou un apprentissage concret.'}, 25: {'definition': 'Un cap doit être tenu ou redéfini. Cette carte parle de direction volontaire, de priorités et de cohérence entre l’objectif et les actes.', 'relation': 'Dans une relation, Cap indique qu’il faut savoir ce que l’on veut réellement construire : maintenir le lien, le redéfinir, avancer ou se retirer. L’ambiguïté devient moins tenable.', 'work': 'Dans le travail, Cap demande de fixer un objectif principal et de vérifier que les décisions quotidiennes y conduisent.', 'spirit': 'Sur le plan général, Cap invite à reprendre la gouverne d’une situation qui risquait de dériver.', 'message': 'Fixez un objectif identifiable et mesurez les décisions à leur capacité de vous en rapprocher.'}, 26: {'definition': 'Un cycle atteint sa limite et ne peut plus continuer sous la même forme. Fin peut annoncer une clôture définitive ou la nécessité de transformer radicalement la situation.', 'relation': 'Dans une relation, Fin signale qu’un mode de relation, une attente ou parfois le lien lui-même arrive à son terme. Une éventuelle reprise supposerait une forme réellement différente.', 'work': 'Dans le travail, Fin parle de clôture de mission, fin de contrat, arrêt d’une méthode ou abandon d’une orientation devenue sans issue.', 'spirit': 'Sur le plan général, Fin demande d’accepter ce qui doit être clôturé afin de libérer l’énergie nécessaire à la suite.', 'message': 'Ne confondez pas la fin d’une forme avec l’échec de tout le parcours.'}, 28: {'definition': 'Un rapport de pouvoir réduit la liberté d’un des protagonistes. Emprise peut passer par la peur, la culpabilité, la dépendance ou le contrôle.', 'relation': 'Dans une relation, Emprise alerte sur un lien où l’un influence excessivement les choix, les émotions ou les contacts de l’autre. Les limites et le consentement doivent redevenir explicites.', 'work': 'Dans le travail, Emprise signale un contrôle excessif, une pression hiérarchique ou une dépendance qui empêche de décider librement.', 'spirit': 'Sur le plan intérieur, Emprise invite à identifier ce qui vous fait agir davantage par contrainte que par choix.', 'message': 'Une relation saine laisse une vraie possibilité de dire oui, non, partir ou changer d’avis.'}, 30: {'definition': 'Cette carte demande d’entendre avant de répondre : paroles explicites, silences, besoins formulés et informations qui risquent d’être ignorées.', 'relation': 'Dans une relation, Écoute indique que la qualité du lien dépend de la capacité à recevoir ce que l’autre dit réellement, sans immédiatement interpréter, corriger ou se défendre.', 'work': 'Dans le travail, Écoute favorise diagnostic, retour utilisateur, négociation et compréhension des besoins avant de proposer une solution.', 'spirit': 'Sur le plan général, Écoute invite à différencier intuition personnelle et message effectivement reçu.', 'message': 'Écoutez le contenu, le ton et les silences avant de construire votre réponse.'}, 31: {'definition': 'Une peur influence la lecture de la situation et peut pousser à éviter, contrôler ou anticiper un danger qui n’est pas toujours vérifié.', 'relation': 'Dans une relation, Peur peut montrer la crainte d’être rejeté, abandonné, trompé ou trop vulnérable. Elle peut freiner un rapprochement même lorsqu’un désir ou un attachement existe.', 'work': 'Dans le travail, Peur signale une décision retardée par la crainte d’échouer, de perdre une sécurité ou d’affronter une responsabilité.', 'spirit': 'Sur le plan intérieur, Peur demande de distinguer le signal de prudence utile du scénario anxieux qui grossit l’incertitude.', 'message': 'Identifiez précisément ce qui est redouté et ce qui, parmi ces craintes, est réellement établi.'}, 32: {'definition': 'Une ouverture nette apparaît là où la situation semblait bloquée. Percée parle d’un passage obtenu après résistance, effort ou compréhension nouvelle.', 'relation': 'Dans une relation, Percée indique qu’un verrou peut céder : conversation enfin possible, émotion reconnue, rapprochement ou décision qui rompt une longue immobilité.', 'work': 'Dans le travail, Percée annonce un obstacle franchi, une solution trouvée ou une opportunité qui permet d’avancer concrètement.', 'spirit': 'Sur le plan général, Percée marque un changement de niveau : ce qui semblait fermé devient accessible.', 'message': 'Profitez de l’ouverture tant qu’elle est concrète et vérifiable.'}, 33: {'definition': 'Quelque chose se retire de la situation : personne, ressource, possibilité, sécurité ou ancien repère. La carte demande d’identifier exactement ce qui n’est plus disponible.', 'relation': 'Dans une relation, Perte peut parler d’une absence, d’un lien diminué, d’une confiance perdue ou d’un projet commun qui ne tient plus. Elle souligne le manque créé par ce retrait.', 'work': 'Dans le travail, Perte peut concerner revenu, client, poste, temps, ressource ou avantage qui disparaît.', 'spirit': 'Sur le plan général, Perte oblige à reconnaître ce qui n’est plus là afin de reconstruire à partir de ce qui demeure.', 'message': 'Nommer précisément la perte évite de transformer un manque particulier en sentiment d’effondrement général.'}, 34: {'definition': 'Une compréhension surgit avant d’être entièrement démontrée. Intuition capte une cohérence, un malaise ou une direction qu’il faut ensuite confronter aux faits.', 'relation': 'Dans une relation, Intuition montre qu’un ressenti concernant l’autre ou le lien mérite attention, mais demande confirmation par les comportements et les échanges réels.', 'work': 'Dans le travail, Intuition peut orienter vers une piste, une personne ou une décision avant que toutes les données soient disponibles.', 'spirit': 'Sur le plan spirituel, Intuition renforce la réceptivité intérieure tout en demandant de distinguer perception, désir et projection.', 'message': 'Prenez l’intuition comme une hypothèse précieuse à vérifier, pas comme une preuve automatique.'}, 35: {'definition': 'Un changement de point de vue ouvre des options qui n’étaient pas visibles depuis l’angle précédent.', 'relation': 'Dans une relation, Perspective invite à regarder le lien depuis l’autre place, un autre horizon temporel ou une autre définition de ce que la relation pourrait être.', 'work': 'Dans le travail, Perspective aide à prendre de la hauteur, comparer plusieurs scénarios et éviter une décision dictée par l’urgence.', 'spirit': 'Sur le plan général, Perspective montre qu’une situation change de sens lorsqu’on élargit le cadre dans lequel on la regarde.', 'message': 'Changez d’angle avant de conclure que toutes les options ont été épuisées.'}, 36: {'definition': 'Un élément empêche actuellement le mouvement : peur, contrainte, silence, opposition, manque de ressource ou décision non prise.', 'relation': 'Dans une relation, Blocage indique qu’un rapprochement ou une évolution ne peut pas se produire tant qu’un frein précis n’est pas levé. Les cartes voisines permettent d’en identifier la nature.', 'work': 'Dans le travail, Blocage signale un point d’arrêt concret : validation manquante, dépendance, problème technique, ressource absente ou décision retardée.', 'spirit': 'Sur le plan général, Blocage demande de chercher le verrou réel plutôt que de pousser plus fort sur l’ensemble de la situation.', 'message': 'Identifiez le verrou unique qui empêche le mouvement avant de multiplier les efforts.'}, 37: {'definition': 'Les éléments d’un ensemble commencent à fonctionner de manière coordonnée. Cohésion parle de solidarité, d’accord et de capacité à rester reliés malgré les différences.', 'relation': 'Dans une relation, Cohésion indique que deux personnes peuvent agir comme une équipe, se soutenir et maintenir un sentiment d’unité même lorsqu’elles ne pensent pas exactement pareil.', 'work': 'Dans le travail, Cohésion favorise coopération, esprit d’équipe et coordination efficace autour d’un objectif partagé.', 'spirit': 'Sur le plan général, Cohésion invite à renforcer ce qui relie sans exiger l’uniformité.', 'message': 'Consolidez les accords essentiels : la cohésion vient d’un socle commun, pas de l’absence de différences.'}, 38: {'definition': 'Une aide concrète ou morale est disponible. Soutien parle d’appui, de présence, de conseil, de protection ou de ressource qui allège la charge.', 'relation': 'Dans une relation, Soutien montre qu’une personne peut réellement être présente dans une difficulté, encourager, aider ou offrir un espace sécurisant.', 'work': 'Dans le travail, Soutien signale un allié, un responsable, une équipe ou une ressource capable de faciliter l’avancement.', 'spirit': 'Sur le plan général, Soutien rappelle que tout ne doit pas être porté seul et invite à reconnaître l’aide effectivement disponible.', 'message': 'Demandez ou acceptez l’aide là où elle peut transformer concrètement la situation.'}, 39: {'definition': 'Le résultat demande du temps. Patience indique une maturation progressive : accélérer artificiellement risquerait de fragiliser ce qui n’est pas encore prêt.', 'relation': 'Dans une relation, Patience montre qu’un rapprochement, une décision ou une confiance ne se construit pas immédiatement. Elle privilégie les signes réguliers plutôt qu’une accélération spectaculaire.', 'work': 'Dans le travail, Patience conseille de respecter les délais de maturation, de validation ou d’apprentissage au lieu de confondre lenteur et échec.', 'spirit': 'Sur le plan général, Patience enseigne à laisser une évolution devenir solide avant d’en exiger la conclusion.', 'message': 'Ne forcez pas le calendrier : observez plutôt si la situation progresse réellement, même lentement.'}, 40: {'definition': 'La situation change de nature et ne peut plus être comprise avec ses anciens repères. Transformation parle d’un avant et d’un après.', 'relation': 'Dans une relation, Transformation indique que le lien doit changer de forme : nouvelle manière de communiquer, autre niveau d’engagement, redéfinition ou détachement.', 'work': 'Dans le travail, Transformation annonce une modification importante de rôle, méthode, organisation ou stratégie.', 'spirit': 'Sur le plan intérieur, Transformation marque une évolution profonde de croyance, d’identité ou de manière d’aborder une expérience.', 'message': 'Acceptez de modifier la forme si vous voulez préserver ce qui a encore du sens.'}, 41: {'definition': 'Une partie de la réalité est volontairement retenue, minimisée ou protégée. Dissimulation parle de ce qui n’est pas montré alors que cela influence la situation.', 'relation': 'Dans une relation, Dissimulation indique qu’un sentiment, une intention, une information ou une autre réalité n’est pas exprimé clairement. Elle demande de ne pas confondre silence et transparence.', 'work': 'Dans le travail, Dissimulation peut signaler une information cachée, une stratégie non déclarée ou un enjeu gardé en coulisses.', 'spirit': 'Sur le plan général, Dissimulation invite à examiner ce qui est évité, retenu ou présenté de manière incomplète.', 'message': 'Ne remplissez pas le silence par des suppositions : cherchez ce qui peut être vérifié.'}, 42: {'definition': 'Une énergie est contenue, dirigée ou contrôlée. Maîtrise parle d’autocontrôle, de retenue, de discipline et de capacité à ne pas se laisser emporter.', 'relation': 'Dans une relation, Maîtrise montre des sentiments, un désir ou une réaction que l’on garde sous contrôle. Elle peut être saine si elle protège les limites, mais devenir un frein si elle empêche toute spontanéité.', 'work': 'Dans le travail, Maîtrise indique compétence, sang-froid, contrôle technique ou capacité à garder une situation exigeante sous direction.', 'spirit': 'Sur le plan intérieur, Maîtrise invite à canaliser l’intensité sans la nier ni la laisser décider à votre place.', 'message': 'Canalisez ce qui est intense, mais vérifiez que le contrôle ne devient pas fermeture.'}, 43: {'definition': 'Quelque chose qui existait à l’état latent commence à devenir visible. Éclosion parle d’un potentiel qui prend forme et demande encore protection.', 'relation': 'Dans une relation, Éclosion indique l’apparition d’un sentiment, d’une confiance ou d’une nouvelle qualité de lien qui n’était pas encore clairement exprimée.', 'work': 'Dans le travail, Éclosion favorise une idée, une collaboration ou une opportunité qui commence enfin à produire des signes concrets.', 'spirit': 'Sur le plan général, Éclosion marque le passage d’une possibilité intérieure à une manifestation observable.', 'message': 'Protégez ce qui commence sans exiger immédiatement qu’il soit déjà pleinement développé.'}, 44: {'definition': 'Le chemin direct n’est pas disponible ou n’est pas le plus juste. Détour indique une étape intermédiaire, une route différente ou un retard qui modifie le parcours.', 'relation': 'Dans une relation, Détour montre que le rapprochement ne suit pas la voie prévue : autre rythme, passage par une amitié, distance, conversation indirecte ou événement intermédiaire.', 'work': 'Dans le travail, Détour demande d’emprunter une autre méthode, un autre interlocuteur ou une étape non prévue pour atteindre l’objectif.', 'spirit': 'Sur le plan général, Détour rappelle qu’une trajectoire non linéaire peut quand même conduire au bon endroit.', 'message': 'Évaluez le détour par ce qu’il permet d’apprendre ou d’atteindre, pas seulement par le temps qu’il ajoute.'}, 45: {'definition': 'Un schéma revient par phases. Cycles parle d’alternance, de répétition et de périodes où une même dynamique se réactive.', 'relation': 'Dans une relation, Cycles peut montrer une alternance de rapprochement et de distance, des reprises régulières ou un même conflit qui revient tant qu’il n’est pas traité.', 'work': 'Dans le travail, Cycles signale une activité périodique, des phases récurrentes ou un problème qui revient selon le même rythme.', 'spirit': 'Sur le plan général, Cycles invite à reconnaître le moment où vous vous trouvez dans une séquence déjà connue.', 'message': 'Repérez ce qui revient à chaque cycle et modifiez le point précis qui entretient la répétition.'}, 47: {'definition': 'Une possibilité de restaurer le lien apparaît après une tension, une rupture ou une incompréhension. Réconciliation suppose toutefois une volonté réelle des parties concernées.', 'relation': 'Dans une relation, Réconciliation favorise reprise de dialogue, excuses, pardon ou rapprochement après une période de froid. Elle vaut surtout lorsque des actes nouveaux corrigent l’ancien problème.', 'work': 'Dans le travail, Réconciliation peut annoncer un accord retrouvé, une médiation réussie ou la reprise d’une collaboration après conflit.', 'spirit': 'Sur le plan général, Réconciliation invite à pacifier ce qui peut l’être sans nier ce qui a causé la rupture.', 'message': 'Réconcilier ne signifie pas effacer le passé : vérifiez ce qui change réellement dans la relation.'}, 48: {'definition': 'Une ouverture est refusée ou n’est pas disponible maintenant. Refus indique un non, une limite, une indisponibilité ou une proposition qui n’est pas acceptée.', 'relation': 'Dans une relation, Refus signifie qu’une demande, un rapprochement ou une forme d’intimité ne trouve pas d’accord à ce moment. La limite doit être respectée ; les autres cartes diront si elle est temporaire ou structurelle.', 'work': 'Dans le travail, Refus peut être une candidature non retenue, une proposition rejetée, une autorisation refusée ou une condition non acceptée.', 'spirit': 'Sur le plan général, Refus apprend à reconnaître une porte fermée sans transformer ce non particulier en rejet de toute possibilité future.', 'message': 'Respectez le non tel qu’il se présente et cherchez ensuite ce qu’il oblige à redéfinir.'}, 50: {'definition': 'Une phase d’expansion devient possible : Envol parle de prise d’autonomie, d’élan, de sortie d’un cadre étroit et de passage à une échelle différente.', 'relation': 'Dans une relation, Envol peut indiquer qu’un lien devient plus libre, plus spontané ou qu’une personne reprend son autonomie avant de pouvoir choisir comment rester reliée.', 'work': 'Dans le travail, Envol favorise lancement, développement, visibilité accrue ou passage d’une idée à une phase plus ambitieuse.', 'spirit': 'Sur le plan général, Envol invite à quitter une limite devenue trop petite pour l’étape actuelle.', 'message': 'Prenez de l’altitude sans perdre les bases qui rendent l’élan durable.'}, 51: {'definition': 'Une personne, une relation ou un projet est laissé sans l’attention ou le soutien nécessaire. Abandon parle d’un retrait qui crée un vide.', 'relation': 'Dans une relation, Abandon peut désigner un départ, un silence prolongé, un désengagement ou la peur très vive d’être laissé. Il faut distinguer l’acte réel de la blessure ancienne qu’il réactive.', 'work': 'Dans le travail, Abandon indique un projet laissé de côté, un soutien retiré ou une responsabilité qui n’est plus assumée.', 'spirit': 'Sur le plan général, Abandon demande de voir ce qui a réellement été quitté et ce qui peut être repris en main par soi-même.', 'message': 'Ne confondez pas le retrait d’une personne avec la perte de toute capacité à agir.'}, 52: {'definition': 'Le passé reste actif dans le présent. Mémoire renvoie à un souvenir, une expérience ancienne ou une empreinte émotionnelle qui influence encore les choix.', 'relation': 'Dans une relation, Mémoire montre qu’un souvenir partagé ou une ancienne blessure continue de colorer le lien actuel. Elle peut soutenir la nostalgie comme raviver une méfiance.', 'work': 'Dans le travail, Mémoire invite à utiliser l’expérience acquise, les précédents et les leçons d’un ancien projet.', 'spirit': 'Sur le plan général, Mémoire demande de reconnaître ce qui appartient au passé tout en voyant comment cela agit encore aujourd’hui.', 'message': 'Utilisez le passé comme information, pas comme scénario obligé de l’avenir.'}, 53: {'definition': 'L’investissement semble faible, absent ou volontairement retenu. Indifférence parle d’un manque d’élan visible plutôt que d’une hostilité ouverte.', 'relation': 'Dans une relation, Indifférence indique peu de signes d’engagement, de curiosité ou de réponse émotionnelle. Elle peut traduire un désintérêt réel ou un retrait à éclaircir avec les cartes voisines.', 'work': 'Dans le travail, Indifférence signale un manque d’implication, de réponse ou de priorité accordée au sujet.', 'spirit': 'Sur le plan général, Indifférence invite à ne pas dépenser toute son énergie là où aucun mouvement réciproque n’apparaît.', 'message': 'Observez les actes : l’absence répétée d’investissement est elle-même une information.'}, 54: {'definition': 'Deux volontés, intérêts ou perceptions s’opposent ouvertement. Conflit demande une clarification des désaccords plutôt qu’une accumulation silencieuse.', 'relation': 'Dans une relation, Conflit annonce ou décrit une confrontation : reproches, divergence de besoins, colère ou lutte pour faire reconnaître sa position.', 'work': 'Dans le travail, Conflit peut concerner rôles, objectifs, ressources, méthode ou autorité et nécessite un cadre de résolution.', 'spirit': 'Sur le plan général, Conflit met en lumière une opposition qui doit être arbitrée ou transformée.', 'message': 'Traitez le désaccord précis sans attaquer toute la relation ou toute la personne.'}, 55: {'definition': 'Une phase intermédiaire relie un ancien état à un nouveau. Transition indique que la situation a déjà commencé à changer mais n’a pas encore trouvé sa forme stable.', 'relation': 'Dans une relation, Transition montre un lien entre deux statuts ou deux manières d’être ensemble : après une rupture, avant un engagement, pendant une redéfinition ou un déplacement.', 'work': 'Dans le travail, Transition concerne changement de poste, réorganisation, passage de projet ou période d’adaptation.', 'spirit': 'Sur le plan général, Transition demande d’accepter provisoirement l’entre-deux sans le confondre avec l’état final.', 'message': 'Ne jugez pas une phase de transition comme si elle devait déjà ressembler au résultat final.'}, 56: {'definition': 'Une dynamique recommence sur des bases différentes. Renouveau parle d’une seconde chance, d’une énergie fraîche ou d’une manière nouvelle d’aborder un sujet connu.', 'relation': 'Dans une relation, Renouveau peut indiquer reprise du lien, nouvel élan, nouvelle rencontre ou changement réel de fonctionnement après une période usée.', 'work': 'Dans le travail, Renouveau favorise relance, nouveau projet, nouvelle méthode ou retour de motivation.', 'spirit': 'Sur le plan général, Renouveau montre que quelque chose peut repartir à condition de ne pas reproduire automatiquement l’ancienne forme.', 'message': 'Recommencez autrement : le renouveau perd son sens si l’on reproduit exactement les anciennes habitudes.'}, 57: {'definition': 'La racine de la situation se trouve dans son histoire, ses bases ou son environnement initial. Origines invite à remonter à ce qui a structuré le problème ou le lien.', 'relation': 'Dans une relation, Origines renvoie au début du lien, à la famille, aux modèles affectifs ou au premier événement qui explique encore la dynamique actuelle.', 'work': 'Dans le travail, Origines demande de revenir au besoin initial, au cahier des charges ou à la raison pour laquelle le projet a été lancé.', 'spirit': 'Sur le plan général, Origines aide à comprendre ce qui a fondé une croyance, une habitude ou une direction de vie.', 'message': 'Revenez au point de départ : il contient souvent la raison du fonctionnement actuel.'}, 59: {'definition': 'Deux ou plusieurs voies restent possibles et une décision devient nécessaire. Choix met l’accent sur la responsabilité de trancher plutôt que sur l’attente d’un signe extérieur.', 'relation': 'Dans une relation, Choix indique qu’il faut décider de la forme du lien, de l’engagement, d’une priorité ou parfois entre plusieurs possibilités affectives.', 'work': 'Dans le travail, Choix place plusieurs options, offres ou stratégies en concurrence et demande des critères clairs.', 'spirit': 'Sur le plan général, Choix rappelle que ne pas décider prolonge aussi une direction, mais sans la maîtriser.', 'message': 'Définissez vos critères avant de choisir : cela réduit le poids de l’hésitation.'}, 60: {'definition': 'Une partie de ce qui est perçu vient de vos attentes, peurs ou scénarios intérieurs. Projection invite à séparer ce qui est imaginé de ce qui est réellement montré.', 'relation': 'Dans une relation, Projection avertit que l’on peut attribuer à l’autre des sentiments, intentions ou promesses qui ne sont pas encore confirmés par ses actes.', 'work': 'Dans le travail, Projection montre qu’une anticipation positive ou négative risque de remplacer l’analyse des données disponibles.', 'spirit': 'Sur le plan intérieur, Projection aide à reconnaître ce que l’on place sur une situation parce que cela résonne avec sa propre histoire.', 'message': 'Demandez-vous quelle partie de votre interprétation est étayée par des faits observables.'}, 61: {'definition': 'Le besoin de se sentir inclus, reconnu et relié à un groupe ou à une personne devient central.', 'relation': 'Dans une relation, Appartenance parle du sentiment d’avoir une place réelle dans la vie de l’autre, dans un couple, une famille ou un cercle proche. Elle peut aussi révéler la peur d’en être exclu.', 'work': 'Dans le travail, Appartenance concerne intégration à une équipe, culture commune et reconnaissance de sa place dans une organisation.', 'spirit': 'Sur le plan général, Appartenance interroge les milieux dans lesquels vous pouvez être vous-même sans devoir vous effacer.', 'message': 'Une vraie appartenance donne une place sans exiger la disparition de l’identité personnelle.'}, 62: {'definition': 'Une résistance active se dresse contre le mouvement souhaité. Opposition indique un non, un conflit d’intérêts ou une force qui pousse dans le sens inverse.', 'relation': 'Dans une relation, Opposition montre que deux personnes ne veulent pas la même chose au même moment, ou qu’un obstacle extérieur contrarie nettement le rapprochement.', 'work': 'Dans le travail, Opposition signale contestation, refus, concurrence ou décision adverse qu’il faut intégrer à la stratégie.', 'spirit': 'Sur le plan général, Opposition demande de mesurer la force contraire avant de décider s’il faut négocier, contourner ou renoncer.', 'message': 'Ne dépensez pas toute votre énergie contre une résistance sans d’abord comprendre sa cause et sa solidité.'}, 63: {'definition': 'Ancrage ramène au corps, au réel, aux habitudes et aux éléments stables qui empêchent une situation de devenir purement mentale ou émotionnelle.', 'relation': 'Dans une relation, Ancrage demande des preuves concrètes de présence : temps partagé, engagements tenus, régularité et gestes qui donnent une réalité au lien.', 'work': 'Dans le travail, Ancrage favorise organisation, budget, calendrier et conditions pratiques nécessaires pour rendre un projet viable.', 'spirit': 'Sur le plan spirituel, Ancrage relie les perceptions et intuitions à la vie quotidienne, au corps et aux faits.', 'message': 'Ramenez la situation à ce qui existe réellement dans les actes, les lieux, le temps et le corps.'}, 64: {'definition': 'Une coupure modifie brutalement ou clairement la continuité d’un lien, d’un projet ou d’une habitude.', 'relation': 'Dans une relation, Rupture désigne une séparation, une coupure de contact ou la fin d’une forme de relation. Une reprise éventuelle nécessiterait un véritable changement de cadre.', 'work': 'Dans le travail, Rupture peut indiquer fin de contrat, départ, arrêt d’un partenariat ou changement radical de stratégie.', 'spirit': 'Sur le plan général, Rupture force à reconnaître qu’un avant et un après se sont installés.', 'message': 'Traitez la rupture comme un fait distinct de ce qui pourrait éventuellement être reconstruit ensuite.'}, 65: {'definition': 'Une information est volontairement déformée, cachée ou présentée d’une manière qui induit en erreur.', 'relation': 'Dans une relation, Mensonge alerte sur une parole fausse, une omission intentionnelle ou une version des faits qui ne tient pas. La confiance dépendra de la capacité à rétablir la vérité.', 'work': 'Dans le travail, Mensonge peut signaler donnée falsifiée, promesse trompeuse, information dissimulée ou communication volontairement ambiguë.', 'spirit': 'Sur le plan général, Mensonge invite aussi à repérer les récits que l’on entretient soi-même pour éviter une réalité inconfortable.', 'message': 'Vérifiez ce qui peut l’être avant de bâtir une décision sur une parole incertaine.'}, 66: {'definition': 'Un point fixe permet de se situer : valeur, personne, règle, objectif ou fait stable auquel revenir lorsque le reste devient confus.', 'relation': 'Dans une relation, Repère désigne ce qui permet de savoir où l’on en est : régularité des échanges, parole donnée, limite claire ou comportement stable.', 'work': 'Dans le travail, Repère aide à suivre l’avancement avec un indicateur, un jalon, un critère ou une référence commune.', 'spirit': 'Sur le plan général, Repère invite à choisir un critère fiable pour ne pas se perdre dans des impressions changeantes.', 'message': 'Choisissez un repère concret et utilisez-le pour mesurer l’évolution réelle.'}, 67: {'definition': 'La peur de perdre une place, la comparaison ou la rivalité perturbe le jugement et le lien.', 'relation': 'Dans une relation, Jalousie peut montrer crainte d’un rival, besoin de réassurance, possessivité ou comparaison avec une autre personne. Elle demande de distinguer menace réelle et peur projetée.', 'work': 'Dans le travail, Jalousie peut se manifester par concurrence personnelle, comparaison de statut ou ressentiment face à la reconnaissance d’autrui.', 'spirit': 'Sur le plan général, Jalousie révèle souvent ce que l’on craint de ne pas recevoir ou de ne pas valoir.', 'message': 'Identifiez le besoin de sécurité derrière la jalousie avant d’accuser ou de contrôler.'}, 69: {'definition': 'L’attention se tourne vers l’intérieur pour comprendre motivations, besoins et contradictions avant d’agir.', 'relation': 'Dans une relation, Introspection montre qu’une personne réfléchit à ce qu’elle ressent, à ses limites ou à la forme de lien qu’elle souhaite. Cela peut créer un temps de retrait sans signifier automatiquement désintérêt.', 'work': 'Dans le travail, Introspection favorise bilan, retour d’expérience et clarification de ses motivations avant un nouveau choix.', 'spirit': 'Sur le plan général, Introspection invite à observer honnêtement ce qui se passe en soi avant de chercher toute la réponse à l’extérieur.', 'message': 'Utilisez le retrait pour obtenir une décision plus claire, pas pour prolonger indéfiniment l’indécision.'}, 70: {'definition': 'Une ouverture proposée n’est pas accueillie et une distance est clairement posée. Rejet touche directement à l’acceptation ou à la place accordée.', 'relation': 'Dans une relation, Rejet indique qu’un rapprochement, une demande ou une expression affective n’est pas reçu comme espéré. La limite exprimée doit être prise au sérieux.', 'work': 'Dans le travail, Rejet correspond à une proposition, candidature, idée ou demande écartée.', 'spirit': 'Sur le plan intérieur, Rejet peut réveiller une blessure ancienne ; la carte invite à distinguer l’événement actuel de la valeur personnelle.', 'message': 'Respectez la réponse obtenue tout en évitant d’en faire un verdict sur votre valeur globale.'}, 71: {'definition': 'Une image idéalisée se confronte à une réalité plus limitée. Désillusion ne détruit pas nécessairement tout : elle retire surtout ce qui avait été imaginé en plus des faits.', 'relation': 'Dans une relation, Désillusion montre qu’une attente, une promesse ou une représentation de l’autre ne correspond pas entièrement à la réalité. Elle demande de regarder le lien tel qu’il est.', 'work': 'Dans le travail, Désillusion indique que le projet, le poste ou la promesse ne correspond pas à ce qui avait été anticipé.', 'spirit': 'Sur le plan général, Désillusion peut devenir une clarification salutaire lorsqu’elle remplace l’idéalisation par une vision plus exacte.', 'message': 'Ne cherchez pas à sauver l’image initiale : regardez ce qui reste vrai une fois l’idéalisation retirée.'}, 72: {'definition': 'Plusieurs facteurs se croisent et empêchent une réponse simple. Complexité demande de séparer les niveaux du problème au lieu de tout traiter comme un seul bloc.', 'relation': 'Dans une relation, Complexité peut signaler sentiments mêlés, contraintes extérieures, histoire passée, distance ou statut ambigu. Une seule explication ne suffit pas.', 'work': 'Dans le travail, Complexité montre un dossier avec plusieurs dépendances, acteurs ou contraintes qu’il faut traiter dans un ordre logique.', 'spirit': 'Sur le plan général, Complexité invite à décomposer la situation avant de chercher une conclusion unique.', 'message': 'Traitez un facteur après l’autre : la complexité diminue lorsqu’on distingue ses composantes.'}, 73: {'definition': 'Deux personnes, idées ou niveaux d’expérience entrent réellement en contact. Connexion parle de lien vivant, de compréhension mutuelle, d’attraction ou de circulation qui se crée entre deux pôles.', 'relation': 'Dans une relation, Connexion indique qu’un contact significatif existe ou peut se rétablir : complicité, échange émotionnel, attraction, sentiment d’être compris ou envie de se rapprocher. Les cartes voisines précisent sa profondeur et sa durée.', 'work': 'Dans le travail, Connexion favorise mise en réseau, rencontre utile, coopération ou association de deux idées qui se renforcent mutuellement.', 'spirit': 'Sur le plan général ou spirituel, Connexion évoque un sentiment d’accord profond entre intuition, expérience et réalité, ou un lien significatif avec une personne ou un symbole.', 'message': 'Observez comment la connexion se manifeste concrètement : échange, présence, coopération ou rapprochement.'}, 74: {'definition': 'Les réserves physiques, mentales ou émotionnelles sont trop sollicitées. Épuisement réduit la capacité à décider, désirer, créer ou maintenir un effort.', 'relation': 'Dans une relation, Épuisement indique qu’un conflit, une attente ou un déséquilibre demande trop d’énergie. Même les sentiments peuvent devenir difficiles à exprimer lorsque les ressources sont vides.', 'work': 'Dans le travail, Épuisement alerte sur surcharge, fatigue chronique ou rythme qui n’est plus soutenable.', 'spirit': 'Sur le plan général, Épuisement demande de restaurer les ressources avant de demander une nouvelle performance.', 'message': 'Ne prenez pas la fatigue pour une vérité définitive sur la situation : restaurez d’abord vos ressources.'}, 75: {'definition': 'Les options immédiates conduisent toutes au même blocage. Impasse indique qu’il faut modifier le cadre ou cesser de répéter la même tentative.', 'relation': 'Dans une relation, Impasse montre qu’aucun progrès n’est possible avec la manière actuelle de communiquer ou de se positionner. Un changement réel de règles est nécessaire.', 'work': 'Dans le travail, Impasse signale qu’une stratégie, un processus ou une négociation ne peut plus avancer sans alternative.', 'spirit': 'Sur le plan général, Impasse ne dit pas qu’il n’existe aucune issue, mais que l’issue n’est pas sur le chemin actuellement emprunté.', 'message': 'Arrêtez de répéter la même solution et changez le cadre du problème.'}, 77: {'definition': 'Les paroles, les valeurs et les actes restent alignés. Intégrité mesure la cohérence morale et la capacité à ne pas se trahir pour obtenir un résultat.', 'relation': 'Dans une relation, Intégrité favorise honnêteté, respect des limites et comportement cohérent avec ce qui est annoncé. Elle valorise un lien où chacun reste digne de confiance.', 'work': 'Dans le travail, Intégrité concerne éthique, fiabilité, transparence et respect des engagements même lorsque cela coûte.', 'spirit': 'Sur le plan général, Intégrité invite à choisir une solution que vous pourrez encore considérer juste une fois l’émotion retombée.', 'message': 'Choisissez ce qui reste cohérent avec vos valeurs lorsque l’intérêt immédiat disparaît.'}, 79: {'definition': 'Une parole engageante risque de ne pas être suivie des actes annoncés. Fausse promesse met l’écart entre discours et réalité au centre.', 'relation': 'Dans une relation, Fausse promesse indique qu’un engagement, un projet commun ou une déclaration doit être jugé sur ce qui est réellement fait ensuite.', 'work': 'Dans le travail, Fausse promesse alerte sur une offre, un délai, un avantage ou un engagement qui paraît séduisant mais n’est pas sécurisé.', 'spirit': 'Sur le plan général, Fausse promesse invite à résister à ce que l’on voudrait croire lorsque les preuves manquent.', 'message': 'Attendez les actes, les dates et les engagements vérifiables avant de considérer la promesse comme acquise.'}, 80: {'definition': 'Une expérience passée a laissé une marque durable qui influence encore les réactions présentes. Empreinte parle de ce qui demeure même après la fin de l’événement.', 'relation': 'Dans une relation, Empreinte montre qu’une personne ou une histoire continue d’avoir un effet émotionnel, positif ou douloureux, sur la manière d’aimer et de faire confiance.', 'work': 'Dans le travail, Empreinte désigne l’effet durable d’une expérience, d’un projet ou d’un mentor sur les méthodes actuelles.', 'spirit': 'Sur le plan général, Empreinte aide à reconnaître ce qui vous a façonné sans supposer que cela doit déterminer toute la suite.', 'message': 'Reconnaissez la marque laissée par le passé sans lui donner automatiquement le contrôle du présent.'}, 81: {'definition': 'Ce qui circule dans un sens doit trouver une réponse dans l’autre. Réciprocité mesure l’équilibre réel entre initiative, attention, désir, soutien ou engagement.', 'relation': 'Dans une relation, Réciprocité est un indicateur fort : les sentiments et les efforts ne reposent pas sur une seule personne. Elle se vérifie dans les initiatives, la disponibilité et les actes mutuels.', 'work': 'Dans le travail, Réciprocité favorise partenariats où chacun apporte une valeur comparable et reçoit un bénéfice identifiable.', 'spirit': 'Sur le plan général, Réciprocité rappelle qu’une relation durable se nourrit d’échanges dans les deux sens.', 'message': 'Mesurez la réciprocité par les initiatives et les actes, pas seulement par la qualité des paroles.'}, 83: {'definition': 'La situation varie fréquemment et ne possède pas encore de base suffisamment fiable. Instabilité rend les prévisions plus fragiles.', 'relation': 'Dans une relation, Instabilité montre alternance de proximité et de retrait, changements d’avis ou disponibilité imprévisible. Il est difficile de construire tant que le rythme reste aussi irrégulier.', 'work': 'Dans le travail, Instabilité peut concerner revenus, équipe, calendrier, stratégie ou environnement qui change trop souvent.', 'spirit': 'Sur le plan général, Instabilité demande de ne pas bâtir un engagement lourd sur une base encore mouvante.', 'message': 'Attendez des signes de continuité avant de traiter une phase instable comme une nouvelle norme.'}, 84: {'definition': 'Une personne cherche à orienter la perception ou le comportement d’une autre par pression, culpabilité, séduction stratégique ou information biaisée.', 'relation': 'Dans une relation, Manipulation alerte sur une influence qui contourne le consentement ou la décision libre. Les limites doivent être claires et les faits vérifiés.', 'work': 'Dans le travail, Manipulation peut apparaître dans une négociation biaisée, une rétention d’information ou une pression qui masque les véritables enjeux.', 'spirit': 'Sur le plan général, Manipulation demande de reprendre du recul avant de décider sous l’effet de la peur, de la dette ou de la culpabilité.', 'message': 'Une décision libre supporte la transparence et la possibilité de dire non sans représailles.'}, 85: {'definition': 'Un mouvement réel est engagé et conduit graduellement vers un résultat. Progression se mesure par des étapes franchies, même modestes.', 'relation': 'Dans une relation, Progression indique que le lien avance : échanges plus réguliers, confiance accrue, rapprochement ou clarification qui construit la suite.', 'work': 'Dans le travail, Progression montre des jalons atteints, des compétences acquises ou un projet qui gagne concrètement du terrain.', 'spirit': 'Sur le plan général, Progression rappelle que l’évolution utile est celle qui laisse des traces observables.', 'message': 'Mesurez ce qui a changé concrètement depuis le point de départ.'}, 86: {'definition': 'La bonne distance permet de rester relié sans envahir ni disparaître. Cette carte cherche l’équilibre entre proximité et autonomie.', 'relation': 'Dans une relation, Juste distance indique qu’un lien fonctionne mieux lorsque chacun dispose d’espace, de limites et d’un rythme respectés. Trop de proximité comme trop de retrait peuvent déséquilibrer la relation.', 'work': 'Dans le travail, Juste distance aide à poser des frontières entre rôle professionnel, disponibilité, délégation et vie personnelle.', 'spirit': 'Sur le plan général, Juste distance invite à rester présent sans absorber ce qui ne vous appartient pas.', 'message': 'Ajustez la proximité jusqu’à ce que le lien reste vivant sans devenir étouffant ou absent.'}, 87: {'definition': 'Une évolution prévue se produit plus tard que souhaité. Retard parle d’un décalage de calendrier, pas nécessairement d’une annulation.', 'relation': 'Dans une relation, Retard indique qu’un message, une rencontre, une décision ou un rapprochement prend davantage de temps. Les autres cartes diront si l’attente conserve une dynamique réelle.', 'work': 'Dans le travail, Retard concerne validation, livraison, réponse, paiement ou étape repoussée.', 'spirit': 'Sur le plan général, Retard demande de distinguer ce qui mûrit encore de ce qui est simplement bloqué.', 'message': 'Un retard reste acceptable s’il existe des signes concrets que le processus continue.'}, 88: {'definition': 'Vision permet de voir plus loin que l’événement immédiat et de construire une représentation cohérente de ce que l’on veut atteindre.', 'relation': 'Dans une relation, Vision demande de regarder au-delà de l’émotion du moment : quelle forme de lien voulez-vous réellement dans quelques mois ou années ?', 'work': 'Dans le travail, Vision favorise stratégie, anticipation et définition d’un objectif à long terme capable de guider les décisions présentes.', 'spirit': 'Sur le plan général ou spirituel, Vision relie intuition et orientation future en donnant une image plus large du chemin.', 'message': 'Décidez le futur que vous voulez construire avant de juger chaque événement isolé.'}, 89: {'definition': 'Une prise de conscience ouvre un nouveau niveau de perception. Éveil marque le moment où l’on ne peut plus voir la situation exactement comme avant.', 'relation': 'Dans une relation, Éveil peut révéler un sentiment, une vérité sur le lien ou une manière nouvelle de comprendre l’autre et ses propres besoins.', 'work': 'Dans le travail, Éveil correspond à une compréhension décisive qui change la stratégie, la vocation ou la manière de travailler.', 'spirit': 'Sur le plan spirituel, Éveil indique une sensibilité accrue, une conscience plus fine ou une étape importante d’exploration intérieure.', 'message': 'Transformez la prise de conscience en changement concret plutôt que de la laisser rester une simple impression.'}, 91: {'definition': 'Sagesse choisit la réponse qui tient compte de l’expérience, des conséquences et du long terme plutôt que de l’impulsion immédiate.', 'relation': 'Dans une relation, Sagesse conseille de répondre avec maturité : respecter les limites, ne pas confondre intensité et compatibilité, et juger le lien sur sa capacité à durer.', 'work': 'Dans le travail, Sagesse favorise décision expérimentée, prudence utile et arbitrage qui protège le long terme.', 'spirit': 'Sur le plan général, Sagesse transforme l’expérience en discernement et réduit la répétition des mêmes erreurs.', 'message': 'Choisissez la décision que vous considérerez encore juste lorsque l’émotion immédiate sera retombée.'}, 92: {'definition': 'Une modification profonde est en cours dans la structure même de la situation. Mutation est plus radicale qu’un simple ajustement.', 'relation': 'Dans une relation, Mutation indique que la nature du lien change : statut, rythme, attentes ou manière d’être ensemble. Le retour à l’ancien fonctionnement paraît peu probable.', 'work': 'Dans le travail, Mutation parle de transformation structurelle : nouveau rôle, secteur, organisation ou modèle.', 'spirit': 'Sur le plan général, Mutation accompagne une période où l’identité, les priorités ou le mode de vie se reconfigurent.', 'message': 'Ne cherchez pas à restaurer exactement l’ancien état si la structure elle-même a changé.'}, 93: {'definition': 'Une possibilité réelle existe mais n’est pas encore transformée en résultat. Potentiel parle de capacité, de marge de développement et de conditions à réunir.', 'relation': 'Dans une relation, Potentiel indique qu’un lien pourrait évoluer favorablement, mais qu’il a encore besoin d’initiatives, de réciprocité et de temps pour devenir une réalité.', 'work': 'Dans le travail, Potentiel signale une idée, une compétence ou une opportunité prometteuse qui doit encore être développée.', 'spirit': 'Sur le plan général, Potentiel montre ce qui peut grandir si les ressources et les choix nécessaires sont effectivement engagés.', 'message': 'Ne confondez pas possibilité et résultat : identifiez ce qui manque encore pour transformer le potentiel en réalité.'}, 95: {'definition': 'Une ouverture concrète apparaît : rencontre, proposition, occasion ou circonstance favorable qui peut être saisie.', 'relation': 'Dans une relation, Opportunité indique une fenêtre pour parler, se revoir, rencontrer quelqu’un ou faire évoluer le lien. Sa valeur dépend de ce qui est réellement fait de cette ouverture.', 'work': 'Dans le travail, Opportunité annonce une proposition, un contact, un projet ou une possibilité d’évolution qui mérite une évaluation rapide.', 'spirit': 'Sur le plan général, Opportunité invite à reconnaître une porte qui s’ouvre sans supposer qu’elle restera disponible indéfiniment.', 'message': 'Une opportunité devient utile lorsqu’elle est reconnue puis transformée en action.'}}
          by_id = {c['id']: c for c in data['main']}
          for cid, o in OVERRIDES.items():
              c = by_id[cid]
              c['definition'] = o['definition']
