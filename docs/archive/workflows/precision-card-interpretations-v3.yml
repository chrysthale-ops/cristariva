          NEW_STORY = '/* CRISTARIVA — moteur narratif précis v3 */\nconst PRECISE_SEX = {"1":"le désir cherche encore sa direction : l’attirance peut exister, mais il faut savoir vers quel type d’intimité on veut réellement aller.","2":"la confiance sexuelle ou affective est fragilisée ; tant qu’une trahison ou un doute important n’est pas clarifié, le lâcher-prise reste difficile.","3":"le climat est léger et favorable au plaisir partagé ; la sexualité peut retrouver spontanéité, jeu et plaisir d’être ensemble.","4":"la distance physique ou affective réduit les occasions d’intimité et refroidit le passage à l’acte, même si le désir n’a pas nécessairement disparu.","5":"le désir est fortement lié à l’état émotionnel ; l’intimité dépend ici de ce qui est ressenti au moment du rapprochement.","6":"un comportement, un regard, une parole ou une initiative peut révéler plus clairement le niveau d’attirance sexuelle réel.","7":"l’attirance peut devenir explosive ou conflictuelle ; l’intensité existe, mais elle demande d’éviter les rapports de force et les réactions impulsives.","8":"un ancien désir, une habitude sexuelle ou un scénario déjà vécu revient et influence la situation présente.","9":"la sexualité a besoin d’équilibre : désir, initiatives et satisfaction doivent circuler dans les deux sens.","10":"une parole, une confidence ou une expérience partagée peut ouvrir une nouvelle compréhension des attentes et des désirs.","11":"les rythmes, envies ou limites sexuelles s’accordent difficilement ; l’attirance seule ne suffit pas à résoudre cette différence.","12":"la sexualité peut être vécue dans un climat de confiance, de plaisir et de satisfaction affective profonde.","13":"une attente sexuelle ou une tentative de rapprochement risque de ne pas aboutir dans la forme espérée.","14":"le désir est sensible, intuitif et changeant ; l’attirance peut être forte mais encore entourée de non-dits ou de fantasmes.","15":"le rythme sexuel n’est pas constant ; rapprochement et retrait alternent et demandent de respecter le tempo réel des deux personnes.","16":"une intimité régulière et rassurante est possible si la relation dispose déjà de bases fiables.","17":"le besoin de sexe, de contact ou de validation risque de devenir trop central et de créer un déséquilibre.","18":"l’intimité peut redevenir plus douce après une blessure, une tension ou une période de fermeture ; la sécurité émotionnelle revient avant l’intensité.","19":"le désir est soutenu par un attachement affectif réel ; la sexualité cherche ici à relier le corps et le cœur.","20":"une clarification ou une décision concernant la vie intime ne peut plus être repoussée indéfiniment.","21":"la carte favorise une rencontre des corps et des intentions lorsque les deux personnes souhaitent réellement se rejoindre.","22":"les attentes sexuelles deviennent plus explicites ; une conversation claire peut réduire les malentendus et faciliter l’intimité.","23":"la sexualité dépend d’un échange franc sur les envies, les limites, la disponibilité et ce qui est réellement souhaité.","24":"un ancien rapport sexuel, une occasion manquée ou une intimité perdue reste regretté et peut nourrir le désir de réparation ou de reprise.","25":"il faut choisir la direction de la vie intime : simple attirance, relation sexuelle, rapprochement affectif ou autre forme de lien.","26":"une phase sexuelle arrive à son terme ; elle ne peut reprendre qu’en changeant profondément de cadre ou de relation.","27":"la sexualité s’apaise ; la pression baisse et l’intimité peut redevenir plus tendre, lente et sécurisante.","28":"le désir est pris dans un rapport de contrôle ou de pouvoir ; le consentement et la liberté de chacun doivent redevenir centraux.","29":"la perspective est favorable à une satisfaction ou à un rapprochement sexuel si les autres cartes ne montrent pas de blocage majeur.","30":"une meilleure sexualité passe par l’écoute des envies, des refus, des réactions du corps et du rythme de l’autre.","31":"la peur de l’échec, du rejet, de la vulnérabilité ou de perdre le contrôle freine le désir ou le passage à l’acte.","32":"un verrou peut céder et rendre possible un rapprochement physique qui semblait jusque-là difficile ou inaccessible.","33":"une intimité, une disponibilité ou un lien sexuel a été perdu ; le manque créé par cette absence devient central.","34":"le corps ou le ressenti indique une attirance ou un malaise qu’il faut écouter puis confronter aux faits et au consentement explicite.","35":"changer de manière d’envisager la sexualité peut ouvrir une possibilité jusque-là invisible.","36":"un frein précis empêche actuellement l’intimité : peur, distance, absence d’accord, fatigue, conflit ou manque de disponibilité.","37":"le rapprochement physique est favorisé lorsque les deux personnes se sentent en équipe, en confiance et accordées.","38":"la sécurité, l’attention et le soutien émotionnel peuvent créer les conditions nécessaires au désir et au lâcher-prise.","39":"le passage à l’acte n’est pas immédiat ; le désir a besoin de temps, de sécurité et d’une progression sans pression.","40":"la manière de vivre la sexualité doit changer ; un ancien fonctionnement ne convient plus et une nouvelle forme d’intimité cherche à émerger.","41":"un désir, une pratique, une relation parallèle ou une intention sexuelle peut ne pas être entièrement exprimé ; la transparence manque.","42":"le désir est contenu ou contrôlé ; il peut exister nettement sans être exprimé ni transformé en passage à l’acte.","43":"une attirance ou une envie sexuelle commence à devenir plus visible, mais elle reste encore fragile et en développement.","44":"le rapprochement physique suit une voie indirecte ou prend plus de temps que prévu ; une étape intermédiaire est nécessaire.","45":"la sexualité fonctionne par phases et peut répéter un cycle de désir, rapprochement, retrait puis reprise.","46":"la sincérité sur les envies, les limites et les intentions favorise une intimité plus libre et