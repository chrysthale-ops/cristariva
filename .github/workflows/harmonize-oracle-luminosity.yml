name: Harmoniser luminosité Oracle CRISTARIVA

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/harmonize_oracle_luminosity.py'
      - '.github/workflows/harmonize-oracle-luminosity.yml'

permissions:
  contents: write

jobs:
  harmonize:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt et la branche de travail
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer Pillow et NumPy
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Harmoniser une à une les 130 cartes sur la luminosité de Joie
        run: python tools/harmonize_oracle_luminosity.py

      - name: Contrôler le périmètre et le rapport
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          report = Path('reports/cristariva-luminosity-report.csv')
          assert report.exists(), 'Rapport de luminosité absent'
          rows = list(csv.DictReader(report.open(encoding='utf-8')))
          assert len(rows) == 130, len(rows)
          assert rows[2]['path'] == 'cards/003-joie-final.webp'
          assert rows[2]['status'] == 'reference_inchangee'
          active = {row['path'] for row in rows}
          assert all(not p.startswith('cards/amour/') for p in active)
          assert all(not p.startswith('cards/tarot/') for p in active)
          worse = [r for r in rows if float(r['distance_after']) > float(r['distance_before']) + 1e-8]
          assert not worse, worse[:5]
          print(f'{len(rows)} cartes actives contrôlées; Joie est inchangée.')
          print(f"{sum(r['status'] == 'harmonisee' for r in rows)} cartes ont reçu un ajustement individualisé.")
          PY

      - name: Publier les images harmonisées sur la branche courante
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards reports/cristariva-luminosity-report.csv
          if git diff --cached --quiet; then
            echo "Aucune modification à publier."
          else
            git commit -m "Harmoniser la luminosité des 130 cartes sur Joie"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
