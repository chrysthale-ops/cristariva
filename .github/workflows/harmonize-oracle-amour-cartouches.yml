name: Harmoniser cartouches Oracle Amour

on:
  push:
    paths:
      - 'tools/harmonize_oracle_amour_cartouches.py'
      - '.github/workflows/harmonize-oracle-amour-cartouches.yml'
      - 'assets/amour-cartouche-restoration/**'
  workflow_dispatch:

concurrency:
  group: harmonize-oracle-amour-cartouches-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  harmonize:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurer les illustrations avant les essais de cartouches
        run: |
          git restore --source=5aa2606c104c468a458ad389220377512cb25bfe --worktree -- cards/amour
          mkdir -p /tmp/oracle-amour-cartouches-check/sources
          cp cards/amour/*.webp /tmp/oracle-amour-cartouches-check/sources/

      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer Pillow, NumPy et la police Cinzel
        run: |
          sudo mkdir -p /usr/local/share/fonts
          sudo curl -L --fail --silent --show-error \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/cinzel/Cinzel%5Bwght%5D.ttf' \
            -o /usr/local/share/fonts/Cinzel-Regular.ttf
          sudo fc-cache -f
          python -m pip install --disable-pip-version-check pillow numpy

      - name: Appliquer la correction r13 aux 80 cartes
        run: python tools/harmonize_oracle_amour_cartouches.py

      - name: Mettre à jour le cache-buster des cartes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('oracle-amour-data.js')
          s=p.read_text(encoding='utf-8')
          s2=re.sub(r'(cards/amour/\d{3}\.webp)\?v=[^\"\']+', r'\1?v=20261007-modele-valide-r13', s)
          if s2!=s:
              p.write_text(s2, encoding='utf-8')
              print('Cache-buster mis à jour en r13')
          else:
              print('Cache-buster déjà à jour')
          PY

      - name: Vérifier le gabarit et le nettoyage du cartouche haut
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('tools/harmonize_oracle_amour_cartouches.py').read_text(encoding='utf-8')
          required=[
              'TOP_OUTER = (198, 2, 314, 54)',
              'TOP_INNER = (204, 7, 308, 48)',
              'TOP_RESTORE_TARGET = (154, 0, 358, 94)',
              'TOP_RESTORE_ELLIPSE = (154, -24, 358, 94)',
              'restore_old_top_cartouche(im)',
          ]
          missing=[item for item in required if item not in text]
          if missing:
              raise SystemExit('Contrôle r13 incomplet: '+', '.join(missing))
          print('R13: ancien cartouche haut neutralisé avant pose du gabarit maître')
          PY

      - name: Générer le contrôle visuel global des 80 cartes
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          cards=[Path('cards/amour')/f'{i:03d}.webp' for i in range(1,81)]
          out=Path('/tmp/oracle-amour-cartouches-check')
          out.mkdir(parents=True,exist_ok=True)
          final_dir=out/'final'
          final_dir.mkdir(exist_ok=True)

          # Quatre planches globales de 20 cartes.
          per_sheet=20
          cols=5
          thumb_w,thumb_h=154,231
          margin=16
          label_h=24
          for sheet_start in range(0,80,per_sheet):
              subset=cards[sheet_start:sheet_start+per_sheet]
              rows=(len(subset)+cols-1)//cols
              canvas=Image.new('RGB',(
                  margin+cols*(thumb_w+margin),
                  margin+rows*(thumb_h+label_h+margin)
              ),'white')
              draw=ImageDraw.Draw(canvas)
              for j,p in enumerate(subset):
                  im=Image.open(p).convert('RGB').resize((thumb_w,thumb_h),Image.Resampling.LANCZOS)
                  c=j%cols
                  r=j//cols
                  x=margin+c*(thumb_w+margin)
                  y=margin+r*(thumb_h+label_h+margin)
                  draw.text((x+thumb_w/2,y+7),p.stem,anchor='ma',fill='black')
                  canvas.paste(im,(x,y+label_h))
              first=sheet_start+1
              last=sheet_start+len(subset)
              canvas.save(out/f'controle-{first:03d}-{last:03d}.png')

          # Quatre planches dédiées au HAUT des 80 cartes, avec un cadrage plus
          # grand pour repérer double contour, ancien arc, ombre ou débordement.
          top_w,top_h=256,60
          top_cols=5
          top_label=22
          for sheet_start in range(0,80,20):
              subset=cards[sheet_start:sheet_start+20]
              rows=4
              canvas=Image.new('RGB',(
                  top_cols*top_w,
                  rows*(top_h+top_label)
              ),'white')
              draw=ImageDraw.Draw(canvas)
              for j,p in enumerate(subset):
                  with Image.open(p) as src:
                      crop=src.convert('RGB').crop((128,0,384,120)).resize((top_w,top_h),Image.Resampling.LANCZOS)
                  c=j%top_cols
                  r=j//top_cols
                  x=c*top_w
                  y=r*(top_h+top_label)
                  draw.text((x+4,y+3),p.stem,fill='black')
                  canvas.paste(crop,(x,y+top_label))
              first=sheet_start+1
              last=sheet_start+len(subset)
              canvas.save(out/f'controle-haut-{first:03d}-{last:03d}.png')

          # Conserver les 80 sorties finales dans l'artefact pour inspection
          # individuelle si une anomalie apparaît sur une planche.
          for p in cards:
              (final_dir/p.name).write_bytes(p.read_bytes())
          PY

      - name: Joindre le contrôle visuel complet
        uses: actions/upload-artifact@v4
        with:
          name: oracle-amour-cartouches-controle-modele-valide-r13
          path: /tmp/oracle-amour-cartouches-check
          if-no-files-found: error

      - name: Publier les cartes corrigées sur la branche de contrôle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/amour/*.webp oracle-amour-data.js
          if git diff --cached --quiet; then
            echo "Aucune modification à publier."
          else
            git commit -m "Nettoyer définitivement les cartouches hauts des 80 cartes Amour"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
