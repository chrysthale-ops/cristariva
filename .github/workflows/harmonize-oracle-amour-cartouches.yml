name: Harmoniser cartouches Oracle Amour

on:
  push:
    paths:
      - 'tools/harmonize_oracle_amour_cartouches.py'
      - '.github/workflows/harmonize-oracle-amour-cartouches.yml'
  workflow_dispatch:

concurrency:
  group: harmonize-oracle-amour-cartouches-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  harmonize:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurer les illustrations avant les essais de cartouches
        run: |
          git restore --source=5aa2606c104c468a458ad389220377512cb25bfe --worktree -- cards/amour
          git restore --source=046980d9717ba06f72da5c323426eac9109adb6c --worktree -- cards/amour/039.webp
          mkdir -p /tmp/oracle-amour-cartouches-check/sources
          cp cards/amour/*.webp /tmp/oracle-amour-cartouches-check/sources/

      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer Pillow et la police Cinzel
        run: |
          sudo mkdir -p /usr/local/share/fonts
          sudo curl -L --fail --silent --show-error \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/cinzel/Cinzel%5Bwght%5D.ttf' \
            -o /usr/local/share/fonts/Cinzel-Regular.ttf
          sudo fc-cache -f
          python -m pip install --disable-pip-version-check pillow

      - name: Appliquer le modèle externe validé aux 80 cartes
        run: python tools/harmonize_oracle_amour_cartouches.py

      - name: Mettre à jour le cache-buster des cartes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('oracle-amour-data.js')
          s=p.read_text(encoding='utf-8')
          s2=re.sub(r'(cards/amour/\d{3}\.webp)\?v=[^\"\']+', r'\1?v=20261006-cartouches-compact-r5', s)
          if s2!=s:
              p.write_text(s2, encoding='utf-8')
              print('Cache-buster mis à jour')
          else:
              print('Cache-buster déjà à jour')
          PY

      - name: Générer le contrôle visuel global
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          cards=[Path('cards/amour')/f'{i:03d}.webp' for i in range(1,81)]
          out=Path('/tmp/oracle-amour-cartouches-check')
          out.mkdir(parents=True,exist_ok=True)

          per_sheet=20
          cols=5
          thumb_w,thumb_h=154,231
          margin=16
          label_h=24
          for sheet_start in range(0,80,per_sheet):
              subset=cards[sheet_start:sheet_start+per_sheet]
              rows=(len(subset)+cols-1)//cols
              canvas=Image.new('RGB',(
                  margin+cols*(thumb_w+margin),
                  margin+rows*(thumb_h+label_h+margin)
              ),'white')
              draw=ImageDraw.Draw(canvas)
              for j,p in enumerate(subset):
                  im=Image.open(p).convert('RGB').resize((thumb_w,thumb_h),Image.Resampling.LANCZOS)
                  c=j%cols
                  r=j//cols
                  x=margin+c*(thumb_w+margin)
                  y=margin+r*(thumb_h+label_h+margin)
                  draw.text((x+thumb_w/2,y+7),p.stem,anchor='ma',fill='black')
                  canvas.paste(im,(x,y+label_h))
              first=sheet_start+1
              last=sheet_start+len(subset)
              canvas.save(out/f'controle-{first:03d}-{last:03d}.png')

          for n in (1,2,3,4,5,6,20,31,32,33,34,35,36,37,38,40,52,54,60,80):
              p=Path('cards/amour')/f'{n:03d}.webp'
              (out/p.name).write_bytes(p.read_bytes())
          PY

      - name: Joindre le contrôle visuel
        uses: actions/upload-artifact@v4
        with:
          name: oracle-amour-cartouches-controle-compact-r5
          path: /tmp/oracle-amour-cartouches-check
          if-no-files-found: error

      - name: Publier les cartes harmonisées
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/amour/*.webp oracle-amour-data.js
          if git diff --cached --quiet; then
            echo "Aucune modification à publier."
          else
            git commit -m "Uniformiser cartouches et typographie de tout l’Oracle Amour"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
