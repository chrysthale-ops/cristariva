name: Grammatical narrative synthesis v8

on:
  push:
    paths:
      - '.github/workflows/astral-v6-polish.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply grammatical narrative synthesis
        run: python tools/literary_final_v7.py
      - name: Validate
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'synthèse finale narrative v8' in s
          block=re.search(r'function renderSynthesis\(\)\{.*?\n\}',s,re.S).group(0)
          assert 'literaryFinalSynthesis()' in block
          assert 'storyInterpretation(state.draw)' not in block
          assert 'cristariva-modele-a-v18-20260913-synthese-narrative-grammaire' in Path('service-worker.js').read_text(encoding='utf-8')
          assert 'Un obstacle réel demeure toutefois' in s
          assert 'Tout n’est pas bloqué pour autant' in s
          scripts='\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S|re.I))
          Path('/tmp/check.js').write_text(scripts,encoding='utf-8')
          PY
          node --check /tmp/check.js
      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Rewrite final synthesis as fluent grammatical narrative"
          git push
