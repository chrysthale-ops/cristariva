name: Diagnostiquer carte 39 Patience

on:
  push:
    branches:
      - fix/patience-card-39-format

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/patience-card-39-format
          fetch-depth: 0
      - run: pip install pillow numpy
      - name: Analyser les marges internes des cartes 39 et 40
        run: |
          python - <<'PY'
          from PIL import Image
          import numpy as np
          from pathlib import Path

          out=[]
          for p in ['cards/039-patience-final.webp','cards/040.webp']:
              im=Image.open(p).convert('RGB')
              a=np.asarray(im)
              white=(a[:,:,0]>235)&(a[:,:,1]>235)&(a[:,:,2]>235)
              nonwhite=~white
              ys,xs=np.where(nonwhite)
              bbox=(int(xs.min()),int(ys.min()),int(xs.max())+1,int(ys.max())+1)
              out.append(f'{p}: size={im.size} nonwhite_bbox={bbox}')
              for n in [1,3,5,10,20,30,40]:
                  top=white[:n,:].mean(); bottom=white[-n:,:].mean(); left=white[:,:n].mean(); right=white[:,-n:].mean()
                  out.append(f'  white_fraction {n}px: top={top:.4f} bottom={bottom:.4f} left={left:.4f} right={right:.4f}')
              corners=[a[0,0].tolist(),a[0,-1].tolist(),a[-1,0].tolist(),a[-1,-1].tolist()]
              out.append(f'  corners={corners}')
          Path('reports').mkdir(exist_ok=True)
          Path('reports/card-39-border-analysis.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          print('\n'.join(out))
          PY
      - name: Committer le rapport et retirer le workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/card-39-border-analysis.txt
          git commit -m "Analyser les marges de la carte 39" || true
          git rm .github/workflows/diagnose-card-39.yml
          git commit -m "Retirer le workflow de diagnostic carte 39" || true
          git push origin HEAD:fix/patience-card-39-format
