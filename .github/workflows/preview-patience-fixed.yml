name: Exporter aperçu Patience corrigée

on:
  push:
    branches:
      - fix/patience-cartouche-position

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/patience-cartouche-position
          fetch-depth: 0
      - uses: actions/upload-artifact@v4
        with:
          name: patience-fixed-preview
          path: cards/039-patience-final.webp
          if-no-files-found: error
      - name: Retirer le workflow temporaire
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/preview-patience-fixed.yml
          git commit -m "Retirer le workflow d’aperçu Patience" || true
          git pull --rebase origin fix/patience-cartouche-position
          git push origin HEAD:fix/patience-cartouche-position
