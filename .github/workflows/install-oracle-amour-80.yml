name: Install Oracle Amour 80 PDF cards
on:
  push:
    branches: [main]
    paths: ['.cristariva-assets/amour80-small-ready.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild card archive
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          parts=sorted(Path('.cristariva-assets').glob('amour80-small-*.b64'))
          if len(parts)!=8:
              raise SystemExit(f'8 fragments attendus, {len(parts)} trouvés')
          s=''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          Path('/tmp/amour80.tar.gz').write_bytes(base64.b64decode(s))
          print('archive', len(s), 'chars')
          PY
          rm -rf /tmp/amour80
          mkdir -p /tmp/amour80
          tar -xzf /tmp/amour80.tar.gz -C /tmp/amour80
          rm -rf cards/amour
          mkdir -p cards/amour
          cp /tmp/amour80/cards/amour/* cards/amour/
          cp /tmp/amour80/cards.json /tmp/cards.json
      - name: Generate corrected Oracle Amour data
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          rows=json.loads(Path('/tmp/cards.json').read_text(encoding='utf-8'))
          out=[]
          for r in rows:
              i=int(r['id'])
              group='main' if i<=60 else 'relation' if i<=70 else 'dating'
              definition=r.get('definition','')
              name=r.get('name','')
              image=f'./cards/amour/{i:03d}.jpg?v=20260918'
              c={
                'id':i,'name':name,'category':r.get('category',''),'definition':definition,
                'keywords':r.get('keywords',''),'group':group,'oracle':'amour','image':image,'imageEn':image,
                'meaning':definition,'message':definition,'reading_relationnel':definition,
                'reading_professionnel':definition,'reading_spirituel':definition,'intensity':'',
                'en':{'name':name,'definition':definition,'category':r.get('category',''),
                      'keywords':r.get('keywords',''),'intensity':'','meaning':definition,'message':definition,
                      'reading_relationnel':definition,'reading_professionnel':definition,'reading_spirituel':definition}
              }
              out.append(c)
          js = "/* CRISTARIVA — Oracle Amour 80 cartes, source PDF corrigé, 18 septembre 2026. */\n"
          js += "(function(){\n  'use strict';\n  const all=" + json.dumps(out,ensure_ascii=False,separators=(',',':')) + ";\n"
          js += "  window.AMOUR_DATA={main:all.filter(c=>c.group==='main'),relation:all.filter(c=>c.group==='relation'),dating:all.filter(c=>c.group==='dating'),all};\n"
          js += "  window.CR_ORACLE_AMOUR_VERSION='2026.09.18-pdf80';\n})();\n"
          Path('oracle-amour-data.js').write_text(js,encoding='utf-8')

          p=Path('relation-astrology.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"const LOVE_SCRIPTS=\[.*?\];", "const LOVE_SCRIPTS=[\n    './oracle-amour-data.js?v=20260918-pdf80',\n    './oracle-amour-integration.js?v=20260918-pdf80',\n    './oracle-amour-compat.js?v=20260918-pdf80'\n  ];", s, flags=re.S)
          s=s.replace("./oracle-amour-integration.js?v=4.1-repair","./oracle-amour-integration.js?v=20260918-pdf80-repair")
          p.write_text(s,encoding='utf-8')

          p=Path('validated-card-titles-v3.6.3.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("function cr363Title(card){return card?(CR363_SHORT_TITLES[Number(card.id)]||card.name||''):'';}",
                      "function cr363Title(card){return card?(card.oracle==='amour'?(card.name||''):(CR363_SHORT_TITLES[Number(card.id)]||card.name||'')):'';}")
          s=s.replace("if(Array.isArray(state.draw))state.draw.forEach(card=>{const title=CR363_SHORT_TITLES[Number(card.id)];if(title)card.name=title;});",
                      "if(Array.isArray(state.draw))state.draw.forEach(card=>{if(card?.oracle==='amour')return;const title=CR363_SHORT_TITLES[Number(card.id)];if(title)card.name=title;});")
          s=s.replace("['relation','date'].forEach(key=>{const card=state[key],title=CR363_SHORT_TITLES[Number(card?.id)];if(card&&title)card.name=title;});",
                      "['relation','date'].forEach(key=>{const card=state[key];if(card?.oracle==='amour')return;const title=CR363_SHORT_TITLES[Number(card?.id)];if(card&&title)card.name=title;});")
          p.write_text(s,encoding='utf-8')

          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"const CACHE_NAME='[^']+';", "const CACHE_NAME='cristariva-v6-20260918-amour80';", s, count=1)
          base=["'./'","'./index.html'","'./manifest.webmanifest'","'./manifest-en.webmanifest'","'./icon-192.png'","'./icon-512.png'","'./relation-astrology.js'","'./relation-astrology-core-v1.4.js'","'./oracle-amour-data.js'","'./oracle-amour-integration.js'","'./oracle-amour-compat.js'"]
          imgs=[f"'./cards/amour/{i:03d}.jpg?v=20260918'" for i in range(1,81)]
          shell='const SHELL=[\n '+',\n '.join(base+imgs)+'\n];'
          s=re.sub(r"const SHELL=\[.*?\];",shell,s,flags=re.S)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate 80-card integration
        run: |
          test "$(find cards/amour -maxdepth 1 -name '*.jpg' | wc -l)" -eq 80
          node --check oracle-amour-data.js
          node --check oracle-amour-integration.js
          node --check oracle-amour-compat.js
          node - <<'NODE'
          global.window=global;
          require('./oracle-amour-data.js');
          const d=global.AMOUR_DATA;
          if(!d || d.main.length!==60 || d.relation.length!==10 || d.dating.length!==10) throw new Error('Comptage invalide');
          const all=[...d.main,...d.relation,...d.dating];
          if(all.length!==80 || all.some(c=>!c.name||!c.definition||!c.image)) throw new Error('Carte incomplète');
          if(all[0].name!=='Rencontre' || all[1].name!=='Attirance' || all[79].name!=='Indéfini') throw new Error('Titres PDF non conformes');
          console.log('Oracle Amour validé',d.main.length,d.relation.length,d.dating.length);
          NODE
          grep -q "card.oracle==='amour'" validated-card-titles-v3.6.3.js
          grep -q "cristariva-v6-20260918-amour80" service-worker.js
      - name: Clean transfer payload
        run: |
          rm -f .cristariva-assets/amour80-small-*.b64 .cristariva-assets/amour80-small-ready.txt
          rm -f .cristariva-assets/amour80-part*.b64 .cristariva-assets/amour-cardpack-part*.b64
          rm -f cards/amour/001.b64 cards/amour/001.webp
          rm -f .github/workflows/install-oracle-amour-80.yml
      - name: Commit final integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install 80 Oracle Amour PDF cards for web and Android"
          git push origin HEAD:main
