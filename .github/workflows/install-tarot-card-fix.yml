name: Audit dimensions Tarot temporaire

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-tarot-card-fix.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Auditer les dimensions des cartes mineures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          folder = Path("cards/tarot/cartes mineures HD")
          backup = Path("cards/tarot/SAUVEGARDE cartes mineures HD avant lot 2 - 2026-09-27")
          ref = folder / "valet_de_bâtons_au_crépuscule.png"
          with Image.open(ref) as im:
              target = im.size
          print(f"REFERENCE|{ref.name}|{target[0]}x{target[1]}|ratio={target[0]/target[1]:.8f}")

          first10 = {
              "as_d_épées_au_coucher_du_soleil.png",
              "as_de_bâtons_au_crépuscule.png",
              "as_de_coupes_au_lac_étoilé.png",
              "as_de_deniers_au_manteau_cramoisi.png",
              "cavalier_d_épées_au_coucher_du_soleil.png",
              "cavalier_de_bâtons_au_clair_de_lune.png",
              "cavalier_de_coupes_au_clair_de_lune.png",
              "cavalier_de_deniers_au_coucher_du_soleil.png",
              "cinq_d_épées_au_coucher_du_soleil.png",
              "cinq_de_bâtons_au_crépuscule.png",
          }

          for p in sorted(folder.glob("*.png")):
              with Image.open(p) as im:
                  w,h = im.size
              mark = "FIRST10" if p.name in first10 else "OTHER"
              same = "SAME" if (w,h)==target else "DIFF"
              print(f"CARD|{mark}|{same}|{p.name}|{w}x{h}|ratio={w/h:.8f}")
              bp = backup / p.name
              if bp.exists():
                  with Image.open(bp) as bim:
                      bw,bh = bim.size
                  print(f"BACKUP|{p.name}|{bw}x{bh}|ratio={bw/bh:.8f}")
          PY
