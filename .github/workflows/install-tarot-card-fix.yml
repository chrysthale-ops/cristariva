name: Recadrer les arcanes mineurs du Tarot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-tarot-card-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recadrage:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Recadrer les 10 cartes concernées sans tronquage
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageStat

          srcdir=Path("cards/tarot/SAUVEGARDE cartes mineures HD avant lot 2 - 2026-09-27")
          dstdir=Path("cards/tarot/cartes mineures HD")

          cards=[
              "trois_de_bâtons_au_crépuscule.png",
              "six_de_bâtons_au_bord_du_lac.png",
              "sept_de_bâtons_au_crépuscule.png",
              "valet_de_bâtons_au_crépuscule.png",
              "reine_de_bâtons_au_crépuscule.png",
              "roi_de_bâtons_au_crépuscule.png",
              "trois_de_coupes_au_coucher_du_soleil.png",
              "quatre_de_coupes_au_crépuscule.png",
              "trois_d_épées_au_coucher_du_soleil.png",
              "six_d_épées_au_coucher_du_soleil.png",
          ]

          TARGET=(1024,1536)

          def bg_color(im):
              rgb=im.convert("RGB")
              w,h=rgb.size
              s=max(4,min(w,h)//80)
              patches=[
                  rgb.crop((0,0,s,s)),
                  rgb.crop((w-s,0,w,s)),
                  rgb.crop((0,h-s,s,h)),
                  rgb.crop((w-s,h-s,w,h)),
              ]
              vals=[]
              for p in patches:
                  st=ImageStat.Stat(p)
                  vals.append(tuple(int(x) for x in st.mean[:3]))
              vals.sort(key=lambda c: sum(c))
              return vals[len(vals)//2]

          for name in cards:
              src=srcdir/name
              dst=dstdir/name
              if not src.exists():
                  raise SystemExit(f"Source absente: {src}")
              with Image.open(src) as im:
                  base=im.convert("RGB")
                  fitted=ImageOps.contain(base,TARGET,method=Image.Resampling.LANCZOS)
                  canvas=Image.new("RGB",TARGET,bg_color(base))
                  x=(TARGET[0]-fitted.width)//2
                  y=(TARGET[1]-fitted.height)//2
                  canvas.paste(fitted,(x,y))
                  canvas.save(dst,"PNG",optimize=True)
                  print(f"{name}: {base.size} -> {fitted.size} -> {TARGET}, offset=({x},{y})")
          PY

      - name: Vérifier toutes les dimensions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          folder=Path("cards/tarot/cartes mineures HD")
          files=sorted(folder.glob("*.png"))
          if len(files)!=56:
              raise SystemExit(f"{len(files)} cartes trouvées au lieu de 56")
          bad=[]
          for p in files:
              with Image.open(p) as im:
                  if im.size!=(1024,1536):
                      bad.append((p.name,im.size))
          if bad:
              raise SystemExit(f"Dimensions incorrectes: {bad}")
          print("OK: 56/56 cartes en 1024x1536")
          PY

      - name: Forcer le renouvellement du cache Tarot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          repl={
            "20260927-all56-r2":"20260928-recadrage-r3",
            "2026.09.27-all56-r2":"2026.09.28-recadrage-r3",
            "cristariva-v37-20260927-all56-r2":"cristariva-v38-20260928-recadrage-r3",
          }
          for fn in ["tarot-minor-sprite-loader.js","tarot-title-image-hotfix.js","service-worker.js","index.html"]:
              p=Path(fn)
              s=p.read_text()
              for a,b in repl.items():
                  s=s.replace(a,b)
              p.write_text(s)
          PY

      - name: Publier les cartes recadrées
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "cards/tarot/cartes mineures HD" tarot-minor-sprite-loader.js tarot-title-image-hotfix.js service-worker.js index.html
          if git diff --cached --quiet; then
            echo "Aucun changement à publier."
            exit 0
          fi
          git commit -m "Recadrer 10 arcanes mineurs du Tarot sans tronquage"
          git push origin HEAD:main
