name: Audit transparence Tarot temporaire

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-tarot-card-fix.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Mesurer les marges transparentes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          folder=Path("cards/tarot/cartes mineures HD")
          for p in sorted(folder.glob("*.png")):
              with Image.open(p) as im:
                  w,h=im.size
                  if "A" in im.getbands():
                      alpha=im.getchannel("A")
                      bbox=alpha.getbbox()
                      amin,amax=alpha.getextrema()
                  else:
                      bbox=(0,0,w,h)
                      amin=amax=255
              if bbox is None:
                  margins=(w,h,w,h)
              else:
                  l,t,r,b=bbox
                  margins=(l,t,w-r,h-b)
              flag="PROBLEME" if any(v>0 for v in margins) else "OK"
              print(f"{flag}|{p.name}|bbox={bbox}|margins=L{margins[0]},T{margins[1]},R{margins[2]},B{margins[3]}|alpha={amin}-{amax}")
          PY
