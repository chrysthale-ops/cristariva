name: Audit marges blanches Tarot temporaire

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-tarot-card-fix.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Détecter les marges blanches extérieures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow numpy
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np
          folder=Path("cards/tarot/cartes mineures HD")

          def white_run(a, top=True):
              h,w,_=a.shape
              x0,x1=int(w*.15),int(w*.85)
              rows=a[:,x0:x1].mean(axis=2)
              if not top:
                  rows=rows[::-1]
              n=0
              for row in rows[:120]:
                  if row.mean()>218 and row.std()<18 and (row>190).mean()>0.96:
                      n+=1
                  else:
                      break
              return n

          vals=[]
          for p in sorted(folder.glob("*.png")):
              a=np.asarray(Image.open(p).convert("RGB"),dtype=np.float32)
              t=white_run(a,True)
              b=white_run(a,False)
              vals.append((max(t,b),t,b,p.name))
          vals.sort(reverse=True)
          for score,t,b,name in vals:
              flag="PROBLEME" if score>=8 else "OK"
              print(f"{flag}|top={t}|bottom={b}|{name}")
          PY
