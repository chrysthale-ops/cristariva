name: Audit marges Tarot temporaire

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-tarot-card-fix.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Détecter les bandes sombres en haut et en bas
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow numpy
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np

          folder = Path("cards/tarot/cartes mineures HD")

          def dark_uniform_band(arr, from_top=True):
              # Analyse jusqu'à 18 % de la hauteur; une bande est retenue
              # si toute la rangée est sombre et très peu variable.
              rows = arr if from_top else arr[::-1]
              max_rows = int(arr.shape[0] * 0.18)
              n = 0
              for row in rows[:max_rows]:
                  mean = row.mean(axis=0)
                  std = row.std(axis=0)
                  brightness = mean.mean()
                  # Tolérance pensée pour les aplats bleu nuit/noirs visibles
                  # sans englober les bordures illustrées et dorées.
                  if brightness < 85 and std.mean() < 18 and mean.max() < 115:
                      n += 1
                  else:
                      break
              return n

          def edge_metrics(arr, n=48):
              top = arr[:n]
              bot = arr[-n:]
              return (
                  float(top.mean()), float(top.std()),
                  float(bot.mean()), float(bot.std())
              )

          results=[]
          for p in sorted(folder.glob("*.png")):
              with Image.open(p) as im:
                  a=np.asarray(im.convert("RGB"))
              t=dark_uniform_band(a, True)
              b=dark_uniform_band(a, False)
              tm,ts,bm,bs=edge_metrics(a)
              results.append((max(t,b),t,b,p.name,tm,ts,bm,bs))
          results.sort(reverse=True)
          for score,t,b,name,tm,ts,bm,bs in results:
              flag="PROBLEME" if (t>=8 or b>=8) else "OK"
              print(f"{flag}|top={t}|bottom={b}|{name}|top48_mean={tm:.1f}|top48_std={ts:.1f}|bottom48_mean={bm:.1f}|bottom48_std={bs:.1f}")
          PY
