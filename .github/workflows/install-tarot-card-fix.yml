name: Audit sources lot 1 Tarot temporaire

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-tarot-card-fix.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Comparer les sources originales du lot 1
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          dst=Path("cards/tarot/cartes mineures HD")
          names=[
              "as_d_épées_au_coucher_du_soleil.png",
              "as_de_bâtons_au_crépuscule.png",
              "as_de_coupes_au_lac_étoilé.png",
              "as_de_deniers_au_manteau_cramoisi.png",
              "cavalier_d_épées_au_coucher_du_soleil.png",
              "cavalier_de_bâtons_au_clair_de_lune.png",
              "cavalier_de_coupes_au_clair_de_lune.png",
              "cavalier_de_deniers_au_coucher_du_soleil.png",
              "cinq_d_épées_au_coucher_du_soleil.png",
              "cinq_de_bâtons_au_crépuscule.png",
          ]
          for name in names:
              src=Path(name)
              out=dst/name
              if not src.exists():
                  print(f"MISSING|{name}")
                  continue
              with Image.open(src) as s:
                  sw,sh=s.size
              with Image.open(out) as d:
                  dw,dh=d.size
              print(f"SOURCE|{name}|{sw}x{sh}|ratio={sw/sh:.8f}|CURRENT={dw}x{dh}")
          PY
