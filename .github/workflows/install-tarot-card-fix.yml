name: Diagnostic bordures Tarot temporaire

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-tarot-card-fix.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Comparer Cavalier et Valet de Bâtons
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow numpy
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np
          folder=Path("cards/tarot/cartes mineures HD")
          names=[
            "cavalier_de_bâtons_au_clair_de_lune.png",
            "valet_de_bâtons_au_crépuscule.png",
          ]
          for name in names:
              a=np.asarray(Image.open(folder/name).convert("RGB"),dtype=np.float32)
              h,w,_=a.shape
              x0,x1=int(w*.12),int(w*.88)
              c=a[:,x0:x1]
              lum=c.mean(axis=2)
              print("IMAGE|"+name)
              for y in list(range(0,81,5))+list(range(h-85,h,5)):
                  yy=max(0,min(h-1,y))
                  row=lum[yy]
                  print(f"ROW|{name}|y={yy}|mean={row.mean():.1f}|std={row.std():.1f}|dark60={(row<60).mean():.3f}|dark90={(row<90).mean():.3f}|light180={(row>180).mean():.3f}")
          PY
