name: Installer les cartes Tarot corrigées

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-tarot-card-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruire les illustrations corrigées
        shell: bash
        run: |
          set -euo pipefail
          echo "Tailles des blocs 009 :"
          wc -c .tarot-card-fix/009.part0 .tarot-card-fix/009.part1a .tarot-card-fix/009.part1b .tarot-card-fix/009.part2
          echo "Tailles des blocs 010 :"
          wc -c .tarot-card-fix/010.part0 .tarot-card-fix/010.part1 .tarot-card-fix/010.part2
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, re
          def build(parts, out, expected):
              s=''.join(Path(p).read_text() for p in parts)
              print(out, 'base64 length=', len(s), 'mod4=', len(s)%4)
              bad=[(i,repr(ch)) for i,ch in enumerate(s) if ch not in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=']
              print(out, 'invalid chars=', bad[:20], 'count=', len(bad))
              data=base64.b64decode(s, validate=True)
              got=hashlib.sha256(data).hexdigest()
              print(out, 'bytes=', len(data), 'sha256=', got)
              if got != expected:
                  raise SystemExit(f'{out}: SHA incorrect')
              Path(out).write_bytes(data)
          build(['.tarot-card-fix/009.part0','.tarot-card-fix/009.part1a','.tarot-card-fix/009.part1b','.tarot-card-fix/009.part2'], 'cards/tarot/009.webp', '94d1c99bf57848f00d34dc1f4fcbe5d8bd038c2819b6677ccac133cd661b211a')
          build(['.tarot-card-fix/010.part0','.tarot-card-fix/010.part1','.tarot-card-fix/010.part2'], 'cards/tarot/010.webp', 'b139163af199e1d120a0e7b7639cba8e88e9b1fd0eab5aa9d098b8901201d1ca')
          PY

      - name: Forcer le renouvellement des caches Tarot
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/20260922e/20260922f/g; s/2026\.09\.22e/2026.09.22f/g' tarot-title-image-hotfix.js
          sed -i "s/service worker v11/service worker v12/; s/21 septembre 2026/22 septembre 2026/; s/cristariva-v11-20260921-narrative-520/cristariva-v12-20260922-tarot-images/; s/2026.09.21-narrative-520/2026.09.22-tarot-images/" service-worker.js

      - name: Publier les cartes corrigées
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/tarot/009.webp cards/tarot/010.webp tarot-title-image-hotfix.js service-worker.js
          if git diff --cached --quiet; then
            echo "Aucun changement à publier."
            exit 0
          fi
          git commit -m "Corriger Le Retour et La Porte Ouverte"
          git push origin HEAD:main
