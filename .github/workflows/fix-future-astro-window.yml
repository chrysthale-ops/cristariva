name: Fix future astrology windows

on:
  push:
    paths:
      - '.github/workflows/fix-future-astro-window.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve future-window guard after unique-date filtering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('unique-peak-dates-v3.9.8.js')
          text = path.read_text(encoding='utf-8')

          old = '''  function finiteDistinctWindows(a,theme,window,intent){
    if(typeof cr37AllTransitWindows!=='function'||typeof cr37QuestionWeight!=='function')return previousRelevant(a,theme,window,intent);

    const all=cr37AllTransitWindows(a,theme,window);
    const ranked=all.map(h=>({hit:h,weight:cr37QuestionWeight(h,intent)}))
      .filter(x=>x.weight>=5||x.hit.priority>=2)
      .sort((a,b)=>
        b.weight-a.weight ||
        (b.hit.priority||0)-(a.hit.priority||0) ||
        (a.hit.bestOrb||99)-(b.hit.bestOrb||99) ||
        (b.hit.points||0)-(a.hit.points||0)
      );

    const unique=[];
    const seenAspect=new Set();
    for(const item of ranked){
      const h=item.hit;
      const key=[h.tr,h.name,h.na,+new Date(h.first),+new Date(h.last)].join('|');
      if(seenAspect.has(key))continue;
      seenAspect.add(key);
      unique.push(h);
    }

    const limit=typeof cr38WindowLimit==='function'?cr38WindowLimit(window):2;
    const selected=[];
    const usedDates=new Set();
    const usedTransit=new Set();

    for(const h of unique){
      if(selected.length>=limit)break;
      const date=dayKey(h.bestDate);
      if(!date||usedDates.has(date)||usedTransit.has(h.tr))continue;
      selected.push(h);
      usedDates.add(date);
      usedTransit.add(h.tr);
    }

    if(selected.length<limit){
      for(const h of unique){
        if(selected.length>=limit)break;
        if(selected.includes(h))continue;
        const date=dayKey(h.bestDate);
        if(!date||usedDates.has(date))continue;
        selected.push(h);
        usedDates.add(date);
      }
    }

    return selected.sort((a,b)=>new Date(a.bestDate)-new Date(b.bestDate));
  }
'''

          new = '''  function finiteDistinctWindows(a,theme,window,intent){
    /* IMPORTANT : previousRelevant contient le garde-fou chargé juste avant
       ce module. Pour les cartes Datation finies (sauf « Immédiat »), il
       exclut déjà le jour civil du tirage, affine le minimum d’orbe et ne
       conserve que de vrais pics futurs. On ne recalcule donc plus ici la
       sélection à partir des transits bruts, car cela annulait ce garde-fou. */
    const hits=previousRelevant(a,theme,window,intent)||[];
    const limit=typeof cr38WindowLimit==='function'?cr38WindowLimit(window):2;
    const selected=[];
    const usedDates=new Set();
    const usedTransit=new Set();

    for(const h of hits){
      if(selected.length>=limit)break;
      const date=dayKey(h.bestDate);
      if(!date||usedDates.has(date)||usedTransit.has(h.tr))continue;
      selected.push(h);
      usedDates.add(date);
      usedTransit.add(h.tr);
    }

    if(selected.length<limit){
      for(const h of hits){
        if(selected.length>=limit)break;
        if(selected.includes(h))continue;
        const date=dayKey(h.bestDate);
        if(!date||usedDates.has(date))continue;
        selected.push(h);
        usedDates.add(date);
      }
    }

    return selected.sort((a,b)=>new Date(a.bestDate)-new Date(b.bestDate));
  }
'''

          if old not in text:
              raise SystemExit('Expected finiteDistinctWindows block not found; refusing unsafe patch.')

          text = text.replace(old, new, 1)
          text = text.replace("dates de pics astrologiques distinctes v3.9.9", "dates de pics astrologiques distinctes v4.0", 1)
          text = text.replace("const CRISTARIVA_UNIQUE_PEAK_DATES_VERSION='3.9.9';", "const CRISTARIVA_UNIQUE_PEAK_DATES_VERSION='4.0';", 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit the correction and remove this one-time workflow
        shell: bash
        run: |
          git config user.name "CRISTARIVA maintenance"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-future-astro-window.yml
          git add unique-peak-dates-v3.9.8.js
          git commit -m "Fix astrology windows starting on reading date"
          git push origin HEAD:main
