name: Construire carte 39 Patience propre

on:
  push:
    branches:
      - fix/patience-39-clean-replacement
    paths:
      - .github/workflows/build-patience39-clean.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/patience-39-clean-replacement
          persist-credentials: true

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer Pillow
        run: python -m pip install --quiet pillow

      - name: Reconstruire Patience 39 sans recouvrements
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          src_path = Path('cards/039.webp')
          dst_path = Path('cards/039-patience-final.webp')

          src = Image.open(src_path).convert('RGB')
          w, h = src.size

          # Retirer les anciens cartouches, médaillon, cadre et marges pour ne garder
          # qu'une illustration propre avant de recréer l'habillage standard.
          left = round(w * 0.055)
          right = round(w * 0.945)
          top = round(h * 0.075)
          bottom = round(h * 0.885)
          scene = src.crop((left, top, right, bottom))
          out = scene.resize((1024, 1536), Image.Resampling.LANCZOS)

          draw = ImageDraw.Draw(out)
          gold = (220, 178, 70)
          navy = (24, 58, 87)
          white = (248, 244, 235)

          # Cadre double : mêmes marges sur les quatre côtés, sans troncature.
          draw.rounded_rectangle((24, 24, 999, 1511), radius=28, outline=gold, width=4)
          draw.rounded_rectangle((34, 34, 989, 1501), radius=24, outline=gold, width=2)

          # Médaillon centré et dégagé du cadre supérieur.
          badge = (463, 8, 561, 106)
          draw.ellipse(badge, fill=navy, outline=gold, width=4)

          font_paths = [
              '/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf',
              '/usr/share/fonts/truetype/liberation2/LiberationSerif-Regular.ttf',
          ]
          font_path = next((p for p in font_paths if Path(p).exists()), None)
          if font_path:
              num_font = ImageFont.truetype(font_path, 54)
              title_font = ImageFont.truetype(font_path, 70)
          else:
              num_font = ImageFont.load_default()
              title_font = ImageFont.load_default()

          def centered_text(text, y, font, fill, stroke_width=0, stroke_fill=None):
              box = draw.textbbox((0, 0), text, font=font, stroke_width=stroke_width)
              tw = box[2] - box[0]
              x = (1024 - tw) // 2
              draw.text((x, y), text, font=font, fill=fill,
                        stroke_width=stroke_width, stroke_fill=stroke_fill)

          centered_text('39', 20, num_font, white)

          # Un seul titre. Une ombre très légère améliore la lecture sans créer de doublon.
          title = 'Patience'
          box = draw.textbbox((0, 0), title, font=title_font)
          tw = box[2] - box[0]
          th = box[3] - box[1]
          tx = (1024 - tw) // 2
          ty = 1387
          draw.text((tx + 2, ty + 2), title, font=title_font, fill=(30, 25, 20))
          draw.text((tx, ty), title, font=title_font, fill=white)

          out.save(dst_path, 'WEBP', quality=92, method=6)

          check = Image.open(dst_path)
          assert check.size == (1024, 1536), check.size
          print(f'{dst_path}: {check.size}, titre unique, cadre complet, médaillon centré')
          PY

      - name: Retirer le workflow temporaire
        run: rm .github/workflows/build-patience39-clean.yml

      - name: Commit de la nouvelle carte
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cards/039-patience-final.webp .github/workflows/build-patience39-clean.yml
          git commit -m 'Remplacer la carte 39 Patience par une version propre'
          git push origin HEAD:fix/patience-39-clean-replacement
