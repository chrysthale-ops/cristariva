name: Correction bas carte Protection

on:
  push:
    paths:
      - ".github/workflows/fix-protection-bottom.yml"

permissions:
  contents: write

jobs:
  fix-protection-bottom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Pillow
        run: python -m pip install --quiet pillow

      - name: Aligner le cadre 68 sur la carte 67
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from collections import deque
          import numpy as np
          import re

          REF = Path("cards/067.webp")
          TARGET = Path("cards/068-protection-final.webp")

          ref = Image.open(REF).convert("RGB")
          target = Image.open(TARGET).convert("RGB")

          def gold_mask(im):
              a = np.asarray(im).astype(np.int16)
              r,g,b = a[:,:,0],a[:,:,1],a[:,:,2]
              return (
                  (r > 130) & (g > 90) & (b < 150) &
                  ((r - b) > 45) & ((g - b) > 20)
              )

          def frame_lines(im):
              m = gold_mask(im)
              h,w = m.shape
              # Les doubles lignes dorées sont continues près des quatre bords.
              row_counts = m.sum(axis=1)
              col_counts = m.sum(axis=0)

              top_zone = row_counts[:max(8,int(h*.09))]
              bot_start = int(h*.91)
              bot_zone = row_counts[bot_start:]
              left_zone = col_counts[:max(8,int(w*.09))]
              right_start = int(w*.91)
              right_zone = col_counts[right_start:]

              top = int(np.argmax(top_zone))
              bottom = bot_start + int(np.argmax(bot_zone))
              left = int(np.argmax(left_zone))
              right = right_start + int(np.argmax(right_zone))

              if not (0 <= top < h*.09 and h*.91 < bottom < h and
                      0 <= left < w*.09 and w*.91 < right < w):
                  raise RuntimeError(f"Cadre non détecté correctement: {(left,top,right,bottom)} / {(w,h)}")
              return left, top, right, bottom

          rl,rt,rr,rb = frame_lines(ref)
          tl,tt,tr,tb = frame_lines(target)
          rw,rh = ref.size
          tw,th = target.size

          # Rapports du gabarit de référence (Jalousie 67).
          rx0, ry0 = rl/(rw-1), rt/(rh-1)
          rx1, ry1 = rr/(rw-1), rb/(rh-1)

          # Calcule un rectangle source tel que les quatre lignes du cadre 68
          # retombent exactement aux mêmes positions proportionnelles que la 67.
          src_w = (tr - tl) / max(1e-9, (rx1-rx0))
          src_h = (tb - tt) / max(1e-9, (ry1-ry0))
          x0 = tl - rx0 * src_w
          y0 = tt - ry0 * src_h
          x1 = x0 + src_w
          y1 = y0 + src_h

          print("Référence 67:", ref.size, (rl,rt,rr,rb),
                "ratios", (rx0,ry0,rx1,ry1))
          print("Protection avant:", target.size, (tl,tt,tr,tb))
          print("Boîte d'alignement:", (x0,y0,x1,y1))

          # Si la boîte déborde de quelques pixels, on crée d'abord un fond sombre
          # plutôt que de laisser réapparaître du blanc dans les coins.
          pad_l = max(0, int(np.ceil(-x0)))
          pad_t = max(0, int(np.ceil(-y0)))
          pad_r = max(0, int(np.ceil(x1 - tw)))
          pad_b = max(0, int(np.ceil(y1 - th)))
          if any((pad_l,pad_t,pad_r,pad_b)):
              bg = Image.new("RGB", (tw+pad_l+pad_r, th+pad_t+pad_b), (10,14,22))
              bg.paste(target, (pad_l,pad_t))
              target = bg
              x0 += pad_l; x1 += pad_l
              y0 += pad_t; y1 += pad_t

          # Recadrage affine exact, puis retour au format maître 1024×1536.
          aligned = target.transform(
              (1024,1536),
              Image.Transform.EXTENT,
              (x0,y0,x1,y1),
              resample=Image.Resampling.LANCZOS
          )

          # Supprime le blanc résiduel connecté aux bords (coins arrondis de l'ancien export).
          a = np.array(aligned)
          h,w,_ = a.shape
          near_white = (a[:,:,0] > 235) & (a[:,:,1] > 235) & (a[:,:,2] > 235)
          seen = np.zeros((h,w), dtype=bool)
          q = deque()
          for x in range(w):
              if near_white[0,x]: q.append((0,x)); seen[0,x]=1
              if near_white[h-1,x]: q.append((h-1,x)); seen[h-1,x]=1
          for y in range(h):
              if near_white[y,0] and not seen[y,0]: q.append((y,0)); seen[y,0]=1
              if near_white[y,w-1] and not seen[y,w-1]: q.append((y,w-1)); seen[y,w-1]=1
          while q:
              y,x=q.popleft()
              for dy,dx in ((1,0),(-1,0),(0,1),(0,-1)):
                  yy,xx=y+dy,x+dx
                  if 0<=yy<h and 0<=xx<w and near_white[yy,xx] and not seen[yy,xx]:
                      seen[yy,xx]=1; q.append((yy,xx))
          a[seen] = np.array([10,14,22], dtype=np.uint8)
          aligned = Image.fromarray(a, "RGB")

          # Vérification finale du bord inférieur : même position relative que la référence.
          fl,ft,fr,fb = frame_lines(aligned)
          expected_bottom = round(ry1*(1536-1))
          if abs(fb-expected_bottom) > 3:
              raise RuntimeError(f"Bas du cadre encore décalé: {fb}, attendu {expected_bottom}")

          aligned.save(TARGET, "WEBP", quality=95, method=6)
          print("Protection après:", aligned.size, (fl,ft,fr,fb),
                "bas attendu", expected_bottom)

          index = Path("index.html")
          html = index.read_text(encoding="utf-8")
          html = html.replace(
              "cards/068-protection-final.webp?v=20261002-format-r5",
              "cards/068-protection-final.webp?v=20261002-format-r6"
          )
          index.write_text(html, encoding="utf-8")

          sw = Path("service-worker.js")
          txt = sw.read_text(encoding="utf-8")
          txt = re.sub(r"const CACHE_NAME='[^']+';",
                       "const CACHE_NAME='cristariva-v83-20261002-protection-bottom-r1';",
                       txt, count=1)
          txt = re.sub(r"const APP_VERSION='[^']+';",
                       "const APP_VERSION='2026.10.02-protection-bottom-r1';",
                       txt, count=1)
          sw.write_text(txt, encoding="utf-8")
          PY

      - name: Publier la correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/068-protection-final.webp index.html service-worker.js
          git diff --cached --check
          git commit -m "Aligner le bas de Protection sur le gabarit de Jalousie"
          git push
