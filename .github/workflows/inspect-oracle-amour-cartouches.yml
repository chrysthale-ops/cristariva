name: Inspecter cartouches Oracle Amour

on:
  push:
    paths:
      - '.github/workflows/inspect-oracle-amour-cartouches.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Créer le contrôle visuel 1 à 6
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          paths=[Path('cards/amour')/f'{i:03d}.webp' for i in range(1,7)]
          imgs=[Image.open(p).convert('RGB') for p in paths]
          thumb_w=256
          thumb_h=384
          margin=20
          label_h=34
          canvas=Image.new('RGB',(3*(thumb_w+margin)+margin,2*(thumb_h+label_h+margin)+margin),'white')
          draw=ImageDraw.Draw(canvas)
          for idx,(p,im) in enumerate(zip(paths,imgs)):
              im=im.resize((thumb_w,thumb_h),Image.Resampling.LANCZOS)
              col=idx%3
              row=idx//3
              x=margin+col*(thumb_w+margin)
              y=margin+row*(thumb_h+label_h+margin)
              canvas.paste(im,(x,y+label_h))
              draw.text((x+thumb_w//2,y+8),p.stem,anchor='ma',fill='black')
          out=Path('/tmp/oracle-amour-inspection')
          out.mkdir(parents=True,exist_ok=True)
          canvas.save(out/'cartes-001-006.png')
          for p in paths:
              (out/p.name).write_bytes(p.read_bytes())
          PY

      - name: Joindre le contrôle visuel
        uses: actions/upload-artifact@v4
        with:
          name: oracle-amour-inspection-001-006
          path: /tmp/oracle-amour-inspection
          if-no-files-found: error
