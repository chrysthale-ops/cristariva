name: Inspecter cartouches Oracle Amour

on:
  push:
    paths:
      - '.github/workflows/inspect-oracle-amour-cartouches.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurer les sources avant harmonisation
        run: git checkout 5aa2606c104c468a458ad389220377512cb25bfe -- cards/amour

      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Créer le contrôle visuel 31 à 38
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          paths=[Path('cards/amour')/f'{i:03d}.webp' for i in range(31,39)]
          imgs=[Image.open(p).convert('RGB') for p in paths]
          thumb_w=256
          thumb_h=384
          margin=20
          label_h=34
          cols=4
          rows=2
          canvas=Image.new('RGB',(cols*(thumb_w+margin)+margin,rows*(thumb_h+label_h+margin)+margin),'white')
          draw=ImageDraw.Draw(canvas)
          for idx,(p,im) in enumerate(zip(paths,imgs)):
              im=im.resize((thumb_w,thumb_h),Image.Resampling.LANCZOS)
              col=idx%cols
              row=idx//cols
              x=margin+col*(thumb_w+margin)
              y=margin+row*(thumb_h+label_h+margin)
              canvas.paste(im,(x,y+label_h))
              draw.text((x+thumb_w//2,y+8),p.stem,anchor='ma',fill='black')
          out=Path('/tmp/oracle-amour-inspection')
          out.mkdir(parents=True,exist_ok=True)
          canvas.save(out/'sources-031-038.png')
          for p in paths:
              (out/p.name).write_bytes(p.read_bytes())
          PY

      - name: Joindre les sources de contrôle
        uses: actions/upload-artifact@v4
        with:
          name: oracle-amour-sources-031-038
          path: /tmp/oracle-amour-inspection
          if-no-files-found: error
