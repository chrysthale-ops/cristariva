name: Supprimer marge interne carte 39 Patience

on:
  push:
    branches:
      - fix/patience-card-39-format

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/patience-card-39-format
          fetch-depth: 0
      - run: pip install pillow numpy
      - name: Supprimer la bordure blanche interne et remettre au gabarit 2 sur 3
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          import numpy as np
          from pathlib import Path

          p = Path('cards/039-patience-final.webp')
          ref = Path('cards/040.webp')
          im = Image.open(p).convert('RGB')
          target = Image.open(ref).convert('RGB').size
          a = np.asarray(im)
          white = (a[:,:,0] > 235) & (a[:,:,1] > 235) & (a[:,:,2] > 235)
          ys, xs = np.where(~white)
          if len(xs) == 0:
              raise SystemExit('Carte 39 vide')
          bbox = (int(xs.min()), int(ys.min()), int(xs.max())+1, int(ys.max())+1)
          cropped = im.crop(bbox)
          # ImageOps.fit conserve les proportions et enlève seulement le surplus
          # nécessaire pour atteindre exactement le ratio de la carte 40.
          fixed = ImageOps.fit(cropped, target, method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
          fixed.save(p, 'WEBP', quality=96, method=6)

          # Vérification automatique : aucun liseré blanc périphérique ne doit subsister.
          b = np.asarray(Image.open(p).convert('RGB'))
          edge = np.concatenate([b[0,:,:], b[-1,:,:], b[:,0,:], b[:,-1,:]], axis=0)
          edge_white = ((edge[:,0] > 245) & (edge[:,1] > 245) & (edge[:,2] > 245)).mean()
          if edge_white > 0.02:
              raise SystemExit(f'Bordure blanche résiduelle trop importante: {edge_white:.4f}')

          Path('reports').mkdir(exist_ok=True)
          Path('reports/card-39-final-check.txt').write_text(
              f'Carte 39 source: {im.size}\nBbox utile détectée: {bbox}\nCarte 39 finale: {Image.open(p).size}\nCarte 40: {target}\nFraction blanche sur le bord final: {edge_white:.6f}\n',
              encoding='utf-8'
          )
          print('bbox', bbox, 'final', Image.open(p).size, 'edge_white', edge_white)
          PY
      - name: Nettoyer les rapports temporaires et committer
        run: |
          rm -f reports/card-39-fix-request.txt reports/card-39-fix-note.txt reports/card-39-fix-trigger.txt reports/card-39-border-analysis.txt reports/card-39-format-check.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corriger la taille visuelle de Patience" || true
          git rm .github/workflows/fix-card-39-inner-margin.yml
          git commit -m "Retirer le workflow temporaire Patience" || true
          git push origin HEAD:fix/patience-card-39-format
