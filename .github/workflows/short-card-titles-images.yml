name: Harmoniser les titres courts sur les cartes

on:
  push:
    paths:
      - '.github/workflows/short-card-titles-images.yml'

permissions:
  contents: write

jobs:
  update-card-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Installer les outils image
        run: python -m pip install --quiet pillow opencv-python-headless numpy
      - name: Remplacer les anciens titres longs dans les illustrations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import cv2, numpy as np
          from PIL import Image, ImageDraw, ImageFont

          names = {
            1:'Direction',5:'Émotions',6:'Indice',7:'Tempête',8:'Échos',9:'Équité',10:'Transmission',14:'Lune',15:'Rythme',16:'Stabilité',18:'Guérison',20:'Échéance',22:'Clarté',23:'Communication',25:'Cap',30:'Écoute',31:'Peur',32:'Percée',34:'Intuition',35:'Perspective',36:'Blocage',37:'Cohésion',38:'Soutien',39:'Patience',40:'Transformation',41:'Dissimulation',42:'Maîtrise',43:'Éclosion',44:'Détour',45:'Cycles',47:'Réconciliation',48:'Refus',50:'Envol',52:'Mémoire',55:'Transition',56:'Renouveau',57:'Origines',59:'Choix',60:'Projection',61:'Appartenance',63:'Ancrage',66:'Repère',69:'Introspection',72:'Complexité',73:'Connexion',77:'Intégrité',78:'Voie',80:'Empreinte',81:'Réciprocité',82:'Signe',85:'Progression',86:'Juste distance',88:'Vision',89:'Éveil',91:'Sagesse',92:'Mutation',93:'Potentiel',94:'Providence',95:'Opportunité',98:'Partenaire',100:'Rencontre',102:'Ex',103:'Collègue',104:'Responsable',106:'Inconnu(e)',107:'Rival(e)',108:'Confident(e)',110:'Contact pro',111:'À distance',112:'Ancien lien',113:'Admirateur',114:'Mentor',115:'Intermédiaire',129:'Déclencheur'
          }

          font_paths = [
            '/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf',
            '/usr/share/fonts/truetype/liberation2/LiberationSerif-Regular.ttf'
          ]
          font_path = next((p for p in font_paths if Path(p).exists()), None)
          if not font_path:
            raise SystemExit('Police serif introuvable')

          def fit_font(draw, text, max_w, h):
            size = max(24, int(h * 0.050))
            while size >= 20:
              font = ImageFont.truetype(font_path, size)
              b = draw.textbbox((0,0), text, font=font, stroke_width=max(1,size//28))
              if b[2]-b[0] <= max_w:
                return font
              size -= 2
            return ImageFont.truetype(font_path, 20)

          changed=[]
          for cid, title in names.items():
            path = Path('cards') / f'{cid:03d}.webp'
            if not path.exists():
              print('Absent:', path)
              continue
            im = Image.open(path).convert('RGB')
            w,h = im.size
            arr = np.array(im)

            # Zone intérieure du cartouche de titre, en préservant le liseré doré.
            x0,x1 = int(w*0.055), int(w*0.945)
            y0,y1 = int(h*0.865), int(h*0.975)
            roi = arr[y0:y1, x0:x1].copy()

            # Efface le lettrage clair existant par inpainting, sans toucher au cadre doré.
            hsv = cv2.cvtColor(roi, cv2.COLOR_RGB2HSV)
            gray = cv2.cvtColor(roi, cv2.COLOR_RGB2GRAY)
            mask = ((gray > 135) & (hsv[:,:,1] < 95)).astype(np.uint8)*255
            kernel = np.ones((5,5), np.uint8)
            mask = cv2.dilate(mask, kernel, iterations=2)
            cleaned = cv2.inpaint(cv2.cvtColor(roi, cv2.COLOR_RGB2BGR), mask, 5, cv2.INPAINT_TELEA)
            arr[y0:y1, x0:x1] = cv2.cvtColor(cleaned, cv2.COLOR_BGR2RGB)
            im = Image.fromarray(arr).convert('RGBA')

            # Voile sombre très doux, proche du rendu historique des cartes.
            overlay = Image.new('RGBA', im.size, (0,0,0,0))
            od = ImageDraw.Draw(overlay)
            band_top = int(h*0.855)
            band_bottom = int(h*0.974)
            steps = max(1, band_bottom-band_top)
            for yy in range(band_top, band_bottom):
              t = (yy-band_top)/steps
              alpha = int(28 + 92*min(1, t*1.4))
              od.line((int(w*0.04),yy,int(w*0.96),yy), fill=(7,10,14,alpha), width=1)
            im = Image.alpha_composite(im, overlay)

            draw = ImageDraw.Draw(im)
            font = fit_font(draw, title, int(w*0.82), h)
            stroke = max(1, int(font.size*0.045))
            box = draw.textbbox((0,0), title, font=font, stroke_width=stroke)
            tw,th = box[2]-box[0], box[3]-box[1]
            tx = (w-tw)//2
            ty = int(h*0.915) - th//2
            # Ombre puis texte ivoire, centrés comme sur le modèle.
            draw.text((tx+2,ty+2), title, font=font, fill=(0,0,0,190), stroke_width=stroke, stroke_fill=(0,0,0,150))
            draw.text((tx,ty), title, font=font, fill=(247,242,232,255), stroke_width=stroke, stroke_fill=(35,35,35,220))

            im.convert('RGB').save(path, 'WEBP', quality=94, method=6)
            changed.append(str(path))
            print(cid, title)

          sw=Path('service-worker.js')
          if sw.exists():
            s=sw.read_text(encoding='utf-8')
            import re
            s=re.sub(r"const CACHE_NAME='[^']+';", "const CACHE_NAME='cristariva-modele-a-v11-20260913-titres-courts-images';", s, count=1)
            sw.write_text(s, encoding='utf-8')

          print(f'{len(changed)} illustrations mises à jour')
          PY
      - name: Publier les nouvelles illustrations
        shell: bash
        run: |
          git config user.name 'CRISTARIVA updater'
          git config user.email 'actions@users.noreply.github.com'
          git add cards service-worker.js
          git diff --cached --quiet && exit 0
          git commit -m 'Afficher les noms courts validés sur les cartes'
          git push
