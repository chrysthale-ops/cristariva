name: Corriger définitivement Patience

on:
  push:
    branches:
      - fix/patience-final-layout

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/patience-final-layout
          fetch-depth: 1
      - run: pip install pillow numpy opencv-python-headless
      - name: Corriger cadre, numéro 39 et titre Patience
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import numpy as np, cv2, os

          ref_path='cards/038.webp'
          dst_path='cards/039-patience-final.webp'
          ref=np.array(Image.open(ref_path).convert('RGB'))
          img=np.array(Image.open(dst_path).convert('RGB'))
          h,w=img.shape[:2]
          assert (w,h)==(1024,1536), (w,h)
          assert ref.shape[:2]==img.shape[:2]

          # 1) Effacer proprement les anciens éléments de cadre situés trop près des bords.
          hsv=cv2.cvtColor(img,cv2.COLOR_RGB2HSV)
          H,S,V=cv2.split(hsv)
          gold=((H>=5)&(H<=38)&(S>=65)&(V>=105)).astype(np.uint8)
          zone=np.zeros((h,w),np.uint8)
          zone[:, :48]=1; zone[:, w-48:]=1
          zone[:105, :]=1; zone[h-65:, :]=1
          old=(gold & zone).astype(np.uint8)*255
          old=cv2.dilate(old,np.ones((5,5),np.uint8),iterations=1)
          img=cv2.inpaint(img,old,3,cv2.INPAINT_TELEA)

          # 2) Reprendre exactement la géométrie des longues lignes dorées de la carte 38.
          rhsv=cv2.cvtColor(ref,cv2.COLOR_RGB2HSV)
          rH,rS,rV=cv2.split(rhsv)
          rgold=((rH>=5)&(rH<=38)&(rS>=65)&(rV>=105)).astype(np.uint8)
          # Comptages en excluant l'art central : on ne garde que les vraies longues lignes du cadre.
          vscore=rgold[110:h-110,:].sum(axis=0)
          hscore=rgold[:,110:w-110].sum(axis=1)
          vcols=np.where(vscore > 0.55*(h-220))[0]
          hrows=np.where(hscore > 0.55*(w-220))[0]
          frame_mask=np.zeros((h,w),np.uint8)
          for x in vcols:
              frame_mask[:,max(0,x-1):min(w,x+2)] = np.maximum(frame_mask[:,max(0,x-1):min(w,x+2)], rgold[:,max(0,x-1):min(w,x+2)])
          for y in hrows:
              frame_mask[max(0,y-1):min(h,y+2),:] = np.maximum(frame_mask[max(0,y-1):min(h,y+2),:], rgold[max(0,y-1):min(h,y+2),:])
          # Compléter avec les pixels or du cadre dans les bandes très proches des bords.
          edge_zone=np.zeros((h,w),np.uint8)
          edge_zone[:, :55]=1; edge_zone[:, w-55:]=1
          edge_zone[:65,:]=1; edge_zone[h-55:,:]=1
          frame_mask=np.maximum(frame_mask, rgold*edge_zone)
          frame_mask=cv2.dilate(frame_mask,np.ones((2,2),np.uint8),iterations=1)
          mask3=frame_mask.astype(bool)
          img[mask3]=ref[mask3]

          # Couleur or médiane du cadre de référence.
          gold_pixels=ref[(frame_mask>0)]
          gold_color=tuple(int(x) for x in np.median(gold_pixels,axis=0)) if len(gold_pixels) else (224,181,67)

          # 3) Retirer le médaillon 39 mal placé puis le reconstruire à la position standard de la 38.
          med_mask=np.zeros((h,w),np.uint8)
          cv2.ellipse(med_mask,(512,50),(76,72),0,0,360,255,-1)
          med_mask=cv2.dilate(med_mask,np.ones((5,5),np.uint8),iterations=1)
          img=cv2.inpaint(img,med_mask,5,cv2.INPAINT_TELEA)

          # Reposer à nouveau les lignes du cadre, puis le médaillon par-dessus, comme sur la 38.
          img[mask3]=ref[mask3]
          pil=Image.fromarray(img).convert('RGBA')
          draw=ImageDraw.Draw(pil)
          cx,cy,r=512,52,47
          navy=(20,52,77,255)
          gc=gold_color+(255,)
          draw.ellipse((cx-r,cy-r,cx+r,cy+r),fill=navy,outline=gc,width=4)
          num_font_path='/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf'
          num_font=ImageFont.truetype(num_font_path,52)
          nb='39'
          bbox=draw.textbbox((0,0),nb,font=num_font)
          tw,th=bbox[2]-bbox[0],bbox[3]-bbox[1]
          draw.text((cx-tw/2,cy-th/2-5),nb,font=num_font,fill=(248,242,224,255))

          # 4) Corriger le titre : effacer uniquement les pixels clairs du vieux texte puis réécrire "Patience".
          arr=np.array(pil.convert('RGB'))
          thsv=cv2.cvtColor(arr,cv2.COLOR_RGB2HSV)
          tH,tS,tV=cv2.split(thsv)
          text_region=np.zeros((h,w),np.uint8)
          text_region[1320:1485,220:820]=1
          light=((tV>155)&(tS<95)).astype(np.uint8)
          text_mask=(light & text_region).astype(np.uint8)*255
          # éviter de trop toucher au décor : ne conserver que les composantes de taille typographique.
          n,labels,stats,cent=cv2.connectedComponentsWithStats(text_mask,8)
          clean=np.zeros_like(text_mask)
          for i in range(1,n):
              x,y,ww,hh,area=stats[i]
              if 4<=ww<=170 and 8<=hh<=90 and 20<=area<=5000 and 1330<=y<=1465:
                  clean[labels==i]=255
          clean=cv2.dilate(clean,np.ones((7,7),np.uint8),iterations=1)
          arr=cv2.inpaint(arr,clean,4,cv2.INPAINT_TELEA)
          pil=Image.fromarray(arr).convert('RGBA')
          overlay=Image.new('RGBA',pil.size,(0,0,0,0))
          od=ImageDraw.Draw(overlay)
          title_font_path='/usr/share/fonts/truetype/liberation2/LiberationSerif-Regular.ttf'
          if not os.path.exists(title_font_path): title_font_path=num_font_path
          title_font=ImageFont.truetype(title_font_path,70)
          title='Patience'
          bbox=od.textbbox((0,0),title,font=title_font)
          tw,th=bbox[2]-bbox[0],bbox[3]-bbox[1]
          tx=512-tw/2
          ty=1398-th/2
          od.text((tx+2,ty+2),title,font=title_font,fill=(0,0,0,120))
          od.text((tx,ty),title,font=title_font,fill=(248,242,224,255))
          pil=Image.alpha_composite(pil,overlay).convert('RGB')

          # Sauvegarde au format du site.
          pil.save(dst_path,'WEBP',quality=96,method=6)

          # Aperçu côte à côte avec la référence 38.
          ref_img=Image.open(ref_path).convert('RGB')
          out_img=Image.open(dst_path).convert('RGB')
          preview=Image.new('RGB',(2048,1536),(245,242,235))
          preview.paste(ref_img,(0,0)); preview.paste(out_img,(1024,0))
          preview.save('/tmp/patience-final-preview.jpg',quality=92)
          print('Correction finale créée : cadre=38, médaillon 39 standard, titre Patience propre, 1024x1536')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: patience-final-preview
          path: /tmp/patience-final-preview.jpg
      - name: Committer la carte et retirer le workflow temporaire
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/039-patience-final.webp
          git rm .github/workflows/fix-patience-final-layout.yml
          git commit -m "Finaliser cadre, numéro et titre de Patience"
          git push origin HEAD:fix/patience-final-layout
