name: Export local backup

on:
  push:
    branches: [backup-export-temp]
    paths:
      - '.github/workflows/export-local-backup.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create complete site archive
        shell: bash
        run: |
          rm -f CRISTARIVA_SITE_COMPLET_2026-09-15.zip
          zip -r CRISTARIVA_SITE_COMPLET_2026-09-15.zip . \
            -x '.git/*' \
               '.github/workflows/export-local-backup.yml' \
               'CRISTARIVA_SITE_COMPLET_2026-09-15.zip'
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: CRISTARIVA_SITE_COMPLET_2026-09-15
          path: CRISTARIVA_SITE_COMPLET_2026-09-15.zip
          compression-level: 0
          retention-days: 1
