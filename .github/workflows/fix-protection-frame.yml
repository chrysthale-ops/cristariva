name: Correction cadrage Protection

on:
  push:
    paths:
      - ".github/workflows/fix-protection-frame.yml"

permissions:
  contents: write

jobs:
  normalize-protection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Pillow
        run: python -m pip install --quiet pillow

      - name: Normaliser la carte 68 sur le gabarit 2:3
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          import re

          card = Path("cards/068-protection-final.webp")
          im = Image.open(card).convert("RGB")

          # Repère le rectangle réel de la carte en supprimant le fond blanc
          # ajouté autour du fichier lors de l'export précédent.
          white = Image.new("RGB", im.size, "white")
          diff = ImageChops.difference(im, white).convert("L")
          mask = diff.point(lambda p: 255 if p > 12 else 0)
          bbox = mask.getbbox()
          if not bbox:
              raise SystemExit("Impossible de détecter les limites de la carte Protection")

          cropped = im.crop(bbox)
          normalized = cropped.resize((1024, 1536), Image.Resampling.LANCZOS)
          normalized.save(card, "WEBP", quality=95, method=6)

          # La correction est désormais intégrée au fichier image : suppression
          # de l'ancien agrandissement CSS spécifique à Protection.
          index = Path("index.html")
          html = index.read_text(encoding="utf-8")
          html = re.sub(
              r'/\* 2026-10-02 — Protection conserve une marge blanche intégrée à son export\.[\s\S]*?'
              r'\.card-detail-media img\[src\*="068-protection-final\.webp"\]\{\s*'
              r'transform:translateY\(\.8%\) scale\(1\.10,1\.07\)!important;\s*'
              r'transform-origin:center center!important;\s*\}\s*',
              '',
              html,
              count=1,
          )
          html = html.replace(
              "cards/068-protection-final.webp?v=20261002-format-r4",
              "cards/068-protection-final.webp?v=20261002-format-r5",
          )
          index.write_text(html, encoding="utf-8")

          sw = Path("service-worker.js")
          text = sw.read_text(encoding="utf-8")
          text = re.sub(
              r"const CACHE_NAME='[^']+';",
              "const CACHE_NAME='cristariva-v82-20261002-protection-frame-source-r1';",
              text,
              count=1,
          )
          text = re.sub(
              r"const APP_VERSION='[^']+';",
              "const APP_VERSION='2026.10.02-protection-frame-source-r1';",
              text,
              count=1,
          )
          sw.write_text(text, encoding="utf-8")

          print("Protection recadrée depuis", bbox, "vers 1024x1536")
          PY

      - name: Publier la correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/068-protection-final.webp index.html service-worker.js
          if git diff --cached --quiet; then
            echo "Aucune modification à publier"
            exit 0
          fi
          git commit -m "Normaliser définitivement le cadrage de Protection"
          git push
