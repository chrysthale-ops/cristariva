name: Comparaison cadrage Tarot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-tarot-cadrage.yml"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Construire les comparaisons
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw, ImageFont

          cur=Path("cards/tarot/cartes mineures HD")
          bak=Path("cards/tarot/SAUVEGARDE cartes mineures HD avant lot 2 - 2026-09-27")
          files={
            25:"trois_de_bâtons_au_crépuscule.png",
            28:"six_de_bâtons_au_bord_du_lac.png",
            29:"sept_de_bâtons_au_crépuscule.png",
            33:"valet_de_bâtons_au_crépuscule.png",
            35:"reine_de_bâtons_au_crépuscule.png",
            36:"roi_de_bâtons_au_crépuscule.png",
            39:"trois_de_coupes_au_coucher_du_soleil.png",
            40:"quatre_de_coupes_au_crépuscule.png",
            53:"trois_d_épées_au_coucher_du_soleil.png",
            56:"six_d_épées_au_coucher_du_soleil.png",
          }
          out=Path("tarot-compare");out.mkdir(exist_ok=True)
          font=ImageFont.load_default()
          card_w,card_h=300,450
          sheet=Image.new("RGB",(4*340,5*500),"white")
          d=ImageDraw.Draw(sheet)
          for idx,(cid,name) in enumerate(files.items()):
              row=idx//2
              col=(idx%2)*2
              for side,(folder,label) in enumerate([(cur,"ACTUEL"),(bak,"SAUVEGARDE")]):
                  im=Image.open(folder/name).convert("RGB")
                  thumb=ImageOps.contain(im,(card_w,card_h))
                  x=(col+side)*340+(340-thumb.width)//2
                  y=row*500+36
                  sheet.paste(thumb,(x,y))
                  d.text(((col+side)*340+8,row*500+8),f"{cid} {label} {im.width}x{im.height}",fill="black",font=font)
          sheet.save(out/"comparaison_suspects.jpg",quality=94)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tarot-compare
          path: tarot-compare/
