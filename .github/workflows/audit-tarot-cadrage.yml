name: Recadrer les arcanes mineurs Tarot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-tarot-cadrage.yml"

permissions:
  contents: write

jobs:
  recadrage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Recadrer les 10 cartes identifiées
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path("cards/tarot/SAUVEGARDE cartes mineures HD avant lot 2 - 2026-09-27")
          dst = Path("cards/tarot/cartes mineures HD")
          files = [
            "trois_de_bâtons_au_crépuscule.png",
            "six_de_bâtons_au_bord_du_lac.png",
            "sept_de_bâtons_au_crépuscule.png",
            "valet_de_bâtons_au_crépuscule.png",
            "reine_de_bâtons_au_crépuscule.png",
            "roi_de_bâtons_au_crépuscule.png",
            "trois_de_coupes_au_coucher_du_soleil.png",
            "quatre_de_coupes_au_crépuscule.png",
            "trois_d_épées_au_coucher_du_soleil.png",
            "six_d_épées_au_coucher_du_soleil.png",
          ]
          for name in files:
              p = src / name
              if not p.exists():
                  raise SystemExit(f"Source manquante: {p}")
              with Image.open(p) as im:
                  im = im.convert("RGB")
                  before = im.size
                  out = im.resize((1024,1536), Image.Resampling.LANCZOS)
                  out.save(dst/name, "PNG", optimize=True)
              print(f"RECARDRE|{name}|{before[0]}x{before[1]} -> 1024x1536")
          PY

      - name: Vérifier les dimensions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          folder=Path("cards/tarot/cartes mineures HD")
          bad=[]
          for p in sorted(folder.glob("*.png")):
              with Image.open(p) as im:
                  if im.size!=(1024,1536):
                      bad.append((p.name,im.size))
          if bad:
              raise SystemExit("Dimensions non conformes: "+repr(bad))
          print("OK: 56 cartes en 1024x1536")
          PY

      - name: Construire une planche de contrôle après recadrage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw, ImageFont
          base=Path("cards/tarot/cartes mineures HD")
          files={
            25:"trois_de_bâtons_au_crépuscule.png",
            28:"six_de_bâtons_au_bord_du_lac.png",
            29:"sept_de_bâtons_au_crépuscule.png",
            33:"valet_de_bâtons_au_crépuscule.png",
            35:"reine_de_bâtons_au_crépuscule.png",
            36:"roi_de_bâtons_au_crépuscule.png",
            39:"trois_de_coupes_au_coucher_du_soleil.png",
            40:"quatre_de_coupes_au_crépuscule.png",
            53:"trois_d_épées_au_coucher_du_soleil.png",
            56:"six_d_épées_au_coucher_du_soleil.png",
          }
          out=Path("tarot-recadrage-preview");out.mkdir(exist_ok=True)
          font=ImageFont.load_default()
          sheet=Image.new("RGB",(5*300,2*490),"white")
          d=ImageDraw.Draw(sheet)
          for i,(cid,name) in enumerate(files.items()):
              r,c=divmod(i,5)
              im=Image.open(base/name).convert("RGB")
              thumb=ImageOps.contain(im,(270,405))
              x=c*300+(300-thumb.width)//2
              y=r*490+38
              sheet.paste(thumb,(x,y))
              d.text((c*300+8,r*490+8),f"{cid} {name}",fill="black",font=font)
          sheet.save(out/"recadrage_10_cartes.jpg",quality=94)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: tarot-recadrage-preview
          path: tarot-recadrage-preview/

      - name: Renouveler les caches du Tarot
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/20260927-all56-r2/20260928-recadrage-r1/g; s/2026\.09\.27-all56-r2/2026.09.28-recadrage-r1/g' tarot-minor-sprite-loader.js tarot-title-image-hotfix.js index.html service-worker.js
          sed -i 's/cristariva-v37-20260927-all56-r2/cristariva-v38-20260928-recadrage-r1/g' service-worker.js

      - name: Publier le recadrage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "cards/tarot/cartes mineures HD" tarot-minor-sprite-loader.js tarot-title-image-hotfix.js service-worker.js index.html
          git status --short
          git commit -m "Recadrer les 10 arcanes mineurs tronqués"
          git push origin HEAD:main
