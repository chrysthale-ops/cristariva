name: Correction luminosité conservatrice PR40

on:
  push:
    branches:
      - fix/oracle-luminosity-joie-reference
    paths:
      - '.github/workflows/fix-pr40-safe-luminosity.yml'

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/oracle-luminosity-joie-reference
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer Pillow et NumPy
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Éclaircir seulement les cartes réellement trop sombres
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          import numpy as np
          from PIL import Image

          report_path = Path('reports/cristariva-luminosity-report.csv')
          reference = Path('cards/003-joie-final.webp')

          def stats(path):
              with Image.open(path) as im:
                  rgb = im.convert('RGB')
                  rgb.thumbnail((360, 540), Image.Resampling.LANCZOS)
                  a = np.asarray(rgb, dtype=np.float32) / 255.0
              lum = 0.2126*a[...,0] + 0.7152*a[...,1] + 0.0722*a[...,2]
              return {
                  'q18': float(np.quantile(lum, .18)),
                  'q50': float(np.quantile(lum, .50)),
                  'q80': float(np.quantile(lum, .80)),
                  'q92': float(np.quantile(lum, .92)),
                  'q95': float(np.quantile(lum, .95)),
              }

          ref = stats(reference)
          threshold = ref['q50'] * 0.85
          target = ref['q50'] * 0.95
          max_gain = 1.10

          with report_path.open(newline='', encoding='utf-8-sig') as f:
              old_rows = list(csv.DictReader(f))
          active_paths = []
          for row in old_rows:
              p = row.get('path', '').strip()
              if p and p not in active_paths and Path(p).exists():
                  active_paths.append(p)
          if str(reference) not in active_paths:
              active_paths.append(str(reference))

          rows = []
          changed = []
          for pstr in active_paths:
              path = Path(pstr)
              before = stats(path)
              factor = 1.0
              reason = 'inchangée'
              if path == reference:
                  reason = 'référence Joie inchangée'
              elif before['q50'] < threshold:
                  desired = target / max(before['q50'], 1e-6)
                  # Protection des hautes lumières : pas de saturation excessive.
                  headroom = 0.985 / max(before['q95'], 1e-6)
                  factor = max(1.0, min(desired, max_gain, headroom))
                  if factor >= 1.02:
                      with Image.open(path) as im:
                          mode = im.mode
                          alpha = im.getchannel('A') if 'A' in mode else None
                          rgb = np.asarray(im.convert('RGB'), dtype=np.float32)
                          out = np.clip(np.rint(rgb * factor), 0, 255).astype(np.uint8)
                          out_im = Image.fromarray(out, 'RGB')
                          if alpha is not None:
                              out_im.putalpha(alpha)
                          ext = path.suffix.lower()
                          if ext == '.png':
                              out_im.save(path, format='PNG', optimize=True)
                          elif ext == '.webp':
                              out_im.save(path, format='WEBP', lossless=True, quality=100, method=6)
                          else:
                              raise RuntimeError(f'Format inattendu: {path}')
                      changed.append(pstr)
                      reason = 'éclaircie sans assombrissement'
                  else:
                      factor = 1.0
                      reason = 'inchangée (hautes lumières protégées)'
              after = stats(path)
              rows.append({
                  'path': pstr,
                  'status': reason,
                  'gain': f'{factor:.4f}',
                  'q18_before': f"{before['q18']:.5f}",
                  'q50_before': f"{before['q50']:.5f}",
                  'q80_before': f"{before['q80']:.5f}",
                  'q92_before': f"{before['q92']:.5f}",
                  'q18_after': f"{after['q18']:.5f}",
                  'q50_after': f"{after['q50']:.5f}",
                  'q80_after': f"{after['q80']:.5f}",
                  'q92_after': f"{after['q92']:.5f}",
              })

          fields = list(rows[0].keys())
          with report_path.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=fields)
              w.writeheader(); w.writerows(rows)

          summary = Path('reports/cristariva-luminosity-summary.txt')
          summary.write_text(
              'Correction conservatrice PR #40\n'
              f'Référence: {reference}\n'
              f'Médiane Joie: {ref["q50"]:.5f}\n'
              f'Seuil de correction: {threshold:.5f} (85 % de Joie)\n'
              f'Cible minimale: {target:.5f} (95 % de Joie)\n'
              f'Gain maximal: {max_gain:.2f}\n'
              f'Cartes actives examinées: {len(active_paths)}\n'
              f'Cartes éclaircies: {len(changed)}\n'
              'Règle: aucune carte n’est assombrie; les hautes lumières sont protégées.\n'
              'Cartes modifiées:\n- ' + ('\n- '.join(changed) if changed else 'aucune') + '\n',
              encoding='utf-8'
          )
          print(f'{len(changed)} cartes éclaircies sur {len(active_paths)}; aucune carte assombrie.')
          PY

      - name: Committer le résultat et retirer le workflow temporaire
        run: |
          git config user.name 'CRISTARIVA automation'
          git config user.email 'actions@users.noreply.github.com'
          git add cards reports/cristariva-luminosity-report.csv reports/cristariva-luminosity-summary.txt
          git rm .github/workflows/fix-pr40-safe-luminosity.yml
          git commit -m 'Corriger la luminosité sans assombrir les cartes'
          git push origin HEAD:fix/oracle-luminosity-joie-reference
