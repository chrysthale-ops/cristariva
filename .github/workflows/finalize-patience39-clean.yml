name: Finaliser Patience 39 sans superposition

on:
  push:
    branches:
      - fix/patience-39-clean-final
    paths:
      - '.tmp/patience39/**'
      - '.github/workflows/finalize-patience39-clean.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Reconstruire la carte 39
        run: |
          cat .tmp/patience39/part*.txt | tr -d '\n\r' | base64 -d > cards/039-patience-final.webp
          python - <<'PY'
          from PIL import Image
          p='cards/039-patience-final.webp'
          im=Image.open(p)
          assert im.size == (1024, 1536), im.size
          assert im.format == 'WEBP', im.format
          print('Carte reconstruite :', im.size, im.format)
          PY

      - name: Renouveler le cache du site
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('service-worker.js')
          s=p.read_text()
          old_cache="cristariva-v109-20261006-reading-panel-compact-r5"
          old_version="2026.10.06-reading-panel-compact-r5"
          new_cache="cristariva-v110-20261006-patience39-clean-r1"
          new_version="2026.10.06-patience39-clean-r1"
          assert old_cache in s, 'Version de cache attendue introuvable'
          assert old_version in s, 'Version applicative attendue introuvable'
          s=s.replace(old_cache,new_cache)
          s=s.replace(old_version,new_version)
          s=s.replace('/* CRISTARIVA — service worker v38 — rafraîchissement du panneau de tirage compact r5. */',
                      '/* CRISTARIVA — service worker v39 — carte 39 Patience finale sans superposition. */')
          p.write_text(s)
          PY

      - name: Nettoyer et livrer
        run: |
          rm -rf .tmp/patience39
          rm -f .github/workflows/finalize-patience39-clean.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Livrer la carte 39 Patience sans superposition"
          git push
