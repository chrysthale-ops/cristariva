name: Bump CRISTARIVA PWA to v55

on:
  push:
    paths:
      - '.github/workflows/bump-pwa-version-v55.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align index PWA version with service worker v55
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old_version = "const CRISTARIVA_PWA_VERSION='2026.09.15-54';"
          new_version = "const CRISTARIVA_PWA_VERSION='2026.09.17-55';"
          old_url = "./service-worker.js?v=20260915-54"
          new_url = "./service-worker.js?v=20260917-55"
          if old_version not in text or old_url not in text:
              raise SystemExit('Expected PWA v54 markers not found; refusing partial patch')
          text = text.replace(old_version, new_version, 1)
          text = text.replace(old_url, new_url, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit PWA version bump and remove one-time workflow
        shell: bash
        run: |
          git config user.name "CRISTARIVA maintenance"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/bump-pwa-version-v55.yml
          git add index.html
          git commit -m "Bump CRISTARIVA PWA to v55"
          git push origin HEAD:main
