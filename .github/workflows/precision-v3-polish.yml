name: Polish precise interpretation wording v3

on:
  push:
    paths:
      - '.github/workflows/precision-v3-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Polish French story wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='paragraphs.push(`Au point de départ de ${subject}, <strong>${name(a)}</strong> pose le décor : ${read(a)}`);'
          new='paragraphs.push(`Concernant ${subject}, le point de départ est <strong>${name(a)}</strong> : ${read(a)}`);'
          if old not in s:
              raise SystemExit('Expected wording not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: grep -F 'Concernant ${subject}, le point de départ est' index.html
      - name: Commit update
        shell: bash
        run: |
          git config user.name 'CRISTARIVA updater'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Polish precise French interpretation wording'
          git push
