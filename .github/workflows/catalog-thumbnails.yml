name: Vignettes légères de tous les jeux

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-thumbnails.yml'
      - 'tools/build_catalog_thumbnails.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Pillow
        run: python -m pip install Pillow
      - name: Générer et vérifier toutes les vignettes
        run: python tools/build_catalog_thumbnails.py
      - name: Livrer les vignettes et leurs correspondances
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cards/catalog-thumbs/v1 catalog-thumbnails-data.js
          if ! git diff --cached --quiet; then
            git commit -m "Générer les vignettes légères des 288 cartes CRISTARIVA, Amour et Tarot"
            git push origin HEAD:main
          fi
