name: Fix card 24 binary

on:
  push:
    paths:
      - '.github/workflows/fix-card24.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild verified WebP and refresh cache
        shell: bash
        run: |
          cat cards/.card24.part00 cards/.card24.part01 cards/.card24.part02 cards/.card24.part03 > /tmp/card24.b64
          base64 -d /tmp/card24.b64 > cards/024.webp
          test "$(wc -c < cards/024.webp)" -eq 11916
          echo "67779a2f2263bec11afc514b66ae31e4a6ebdad559d68ec8ae13497dd102c2dd  cards/024.webp" | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('service-worker.js')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r"const CACHE_NAME='[^']+';", "const CACHE_NAME='cristariva-modele-a-v7-20260913-card24-binary';", s, count=1)
          p.write_text(s, encoding='utf-8')
          PY
          rm -f cards/.card24.part00 cards/.card24.part01 cards/.card24.part02 cards/.card24.part03
          rm -f tmp-safe-check2.txt
          rm -f .github/workflows/fix-card24.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix card 24 binary and refresh PWA cache"
          git push
